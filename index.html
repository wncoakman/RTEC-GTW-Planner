<script>
/* ===================== Offline support =====================
   sw.js precaches the app shell and the CDN libraries on first online load.
   Service workers need https:// (or localhost); they are skipped under file://. */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

/* ===================== Constants ===================== */
const WORK_TASK_TYPES = [
  'Prune - Crown Clean','Prune - Crown Raise','Prune - Crown Reduce','Prune - Crown Thin',
  'Prune - Deadwood Removal','Prune - Structural / Young Tree Training','Prune - Vista / View',
  'Prune - Clearance (Structure/Utility)','Removal - Full Tree Removal','Removal - Partial / Hazard Limb',
  'Stump Grinding','Cabling / Bracing','Root Collar Excavation','PHC - Deep Root Fertilization',
  'PHC - Insect Treatment','PHC - Disease Treatment','PHC - Soil Injection / Amendment',
  'Planting - New Tree Installation','Mulching','Haul Wood','Chip Debris / Haul Chips','Other (specify)'
];
const ACCESS_ITEMS = [
  ['neighborPermission',"Neighbor's Written Permission"],
  ['dominion','Dominion'],
  ['pepco','Pepco'],
  ['parkingPermits','Parking Permits'],
  ['missUtility','Miss Utility'],
  ['ddotRemoval','DDOT Removal Permit']
];
const SPECIES_OPTIONS = [
  'Red Oak','White Oak','Bur Oak','Pin Oak','Sugar Maple','Red Maple','Silver Maple',
  'Norway Maple','Japanese Maple','River Birch','American Elm','Honeylocust',
  'Littleleaf Linden','Flowering Pear (Callery)','Flowering Dogwood','Eastern Redbud',
  'Colorado Blue Spruce','Norway Spruce','White Pine','Austrian Pine','Arborvitae',
  'Crabapple','Magnolia','Tulip Poplar','Black Walnut','Hackberry','American Sycamore',
  'Green Ash','White Ash','Shagbark Hickory','Weeping Willow','Eastern Red Cedar',
  'Boxwood (shrub)','Burning Bush (shrub)','Serviceberry','Sweetgum','Kousa Dogwood'
];
const COLORS = ['#FF3B30','#FFCC00','#FFFFFF','#111111','#1A73E8','#34C759'];
const ARBORISTS = ['Ian Bailey','Ziggy Zartman','Andy Ross','Jason Stoner','Riley Kemp','Chris Hamley','Corey Dalrymple'];
const ARB_PREFS_KEY = 'rtecArboristPrefs';

/* ===================== State ===================== */
let uidCounter = 1;
function uid(){ return uidCounter++; }
function newTask(){ return { id: uid(), type: WORK_TASK_TYPES[0], customType:'', details:'', hours:'', price:'', splitJob:false, photo:null }; }
function newTree(){ return { id: uid(), mainPhoto:null, gps:{lat:'',lng:'',accuracy:''}, species:'', dbh:'', location:'', price:'', tasks:[newTask()], open:true }; }
function newState(){
  return {
    step: 0,
    client: { leadNum:'', city:'', name:'', phone:'', email:'', date:'', arborist: arboristPrefs().last, crewSize:'' },
    trees: [newTree()],
    equipment: {
      bucketTruck:'None', chipper:'None', chipTruck:'None', extraChipTruck:'No',
      crane:{ needed:false, spec:'', price:'' },
      stumpGrinder:'None', miniLoader:'None', shuttleVehicle:'No',
      spyderLift:{ needed:false, price:'' }
    },
    workPlan: '',
    safety: '',
    accessPermits: { standard:{ neighborPermission:false,dominion:false,pepco:false,parkingPermits:false,missUtility:false,ddotRemoval:false }, custom:[] },
    notes: { crew:'', client:'', internal:'', scheduling:'' }
  };
}
let state = newState();

/* The job (including photo data URLs) lives in IndexedDB. localStorage caps out around 5MB,
   which a single phone photo can exceed, so it is only read as a fallback for older saves. */
const DB_NAME = 'rtec-gtw-job-builder', DB_STORE = 'jobs', LEGACY_KEY = 'rtecGtwJob';
let dbPromise = null;
function openDb(){
  if(!dbPromise){
    dbPromise = new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>req.result.createObjectStore(DB_STORE);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }
  return dbPromise;
}
async function idb(mode, fn){
  const db = await openDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = ()=>resolve(req && req.result);
    tx.onerror = tx.onabort = ()=>reject(tx.error);
  });
}
let saveFailedWarned = false;
async function saveState(){
  try{ await idb('readwrite', st=>st.put(JSON.parse(JSON.stringify(state)), 'current')); saveFailedWarned = false; }
  catch(e){
    console.error('Save failed', e);
    if(!saveFailedWarned){ saveFailedWarned = true; toast('Warning: job could not be saved on this device. Export before closing.'); }
  }
}
async function loadState(){
  let s = null;
  try{ s = await idb('readonly', st=>st.get('current')); }catch(e){}
  if(!s){ try{ const raw = localStorage.getItem(LEGACY_KEY); if(raw) s = JSON.parse(raw); }catch(e){} }
  if(!s) return null;
  s = normalizeState(s);
  uidCounter = 1 + Math.max(0, ...collectIds(s));
  return s;
}
/* Fill in any fields missing from an older save so rendering never hits undefined. */
function normalizeState(s){
  const d = newState();
  const out = Object.assign(d, s);
  out.client = Object.assign(newState().client, s.client);
  out.equipment = Object.assign(newState().equipment, s.equipment);
  out.equipment.crane = Object.assign({needed:false,spec:'',price:''}, out.equipment.crane);
  out.equipment.spyderLift = { needed: !!(out.equipment.spyderLift && out.equipment.spyderLift.needed), price: (out.equipment.spyderLift && out.equipment.spyderLift.price) || '' };
  out.accessPermits = { standard: Object.assign(newState().accessPermits.standard, s.accessPermits && s.accessPermits.standard), custom: (s.accessPermits && s.accessPermits.custom) || [] };
  out.notes = Object.assign(newState().notes, s.notes);
  out.trees = (Array.isArray(s.trees) && s.trees.length ? s.trees : [newTree()]).map(t=>{
    const tree = Object.assign(newTree(), t);
    tree.gps = Object.assign({lat:'',lng:'',accuracy:''}, t.gps);
    tree.tasks = (Array.isArray(t.tasks) ? t.tasks : []).map(tk=>{
      const task = Object.assign(newTask(), tk);
      if(task.splitVisit) task.splitJob = true;
      delete task.splitVisit;
      return task;
    });
    return tree;
  });
  out.step = Math.min(Math.max(0, Number(out.step)||0), 3);
  return out;
}
function collectIds(s){
  const ids=[];
  (s.trees||[]).forEach(t=>{ ids.push(Number(t.id)||0); (t.tasks||[]).forEach(tk=>ids.push(Number(tk.id)||0)); });
  return ids;
}
let debounceTimer=null;
function persist(){ clearTimeout(debounceTimer); debounceTimer = setTimeout(saveState, 300); }
function flushSave(){ if(debounceTimer){ clearTimeout(debounceTimer); debounceTimer=null; saveState(); } }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushSave(); });
window.addEventListener('pagehide', flushSave);

/* ===================== Utils ===================== */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setPath(obj, path, value){ const parts = path.split('.'); let cur=obj; for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; } cur[parts[parts.length-1]] = value; }
function getPath(obj, path){ return path.split('.').reduce((c,p)=> c==null?c:c[p], obj); }
function toast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
/* Decode any browser-readable image and re-encode it as a JPEG no larger than maxDim on its
   long edge. Keeps storage, PDFs and ZIPs small and guarantees jsPDF gets JPEG data. */
function fileToJpegDataUrl(file, maxDim=1800, quality=0.85){
  return fileToDataUrl(file).then(src=>new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight;
      const k = Math.min(1, maxDim/Math.max(w,h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>reject(new Error('This image format could not be read.'));
    img.src = src;
  }));
}
function dataUrlToBlob(dataUrl){
  const [meta,b64] = dataUrl.split(',');
  const mime = (meta.match(/:(.*?);/)||[,'image/jpeg'])[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
}
function csvEsc(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function money(n){ return '$'+(Number(n)||0).toFixed(2); }

/* ===================== Step scaffolding ===================== */
const STEPS = ['Client & Site', 'Trees', 'Logistics', 'Generate'];
const appRoot = document.getElementById('appRoot');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');

function treeSubtotal(tree){ return (Number(tree.price)||0) + tree.tasks.reduce((s,t)=>s+(Number(t.price)||0),0); }
function updateSubtitle(){
  document.getElementById('jobSubtitle').textContent = state.client.name
    ? `${state.client.name}${state.client.city ? ' — '+state.client.city.toUpperCase() : ''}` : 'New Job';
}
function render(){
  updateSubtitle();
  renderStepper();
  if(state.step===0) renderStepClient();
  else if(state.step===1) renderStepTrees();
  else if(state.step===2) renderStepLogistics();
  else renderStepGenerate();
  backBtn.disabled = state.step===0;
  nextBtn.textContent = state.step===STEPS.length-1 ? 'Done' : 'Next';
  nextBtn.style.visibility = state.step===STEPS.length-1 ? 'hidden' : 'visible';
  persist();
}
function renderStepper(){
  const nav = document.getElementById('stepperNav');
  nav.innerHTML = STEPS.map((s,i)=>`
    <button data-step="${i}" class="px-2.5 py-1 rounded-full ${i===state.step?'bg-white text-brand font-semibold':'bg-white/10 text-white/80'}">${i+1}. ${esc(s)}</button>
  `).join('<span class="text-white/40">›</span>');
  const dots = document.getElementById('stepDots');
  dots.innerHTML = STEPS.map((_,i)=>`<span class="step-dot ${i===state.step?'active':''}"></span>`).join('');
}

/* ===================== Step 0: Client & Site Info (no header) ===================== */
function renderStepClient(){
  const c = state.client;
  appRoot.innerHTML = `
  <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <label class="col-span-2 text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">SingleOps #</span>
        <input data-bind="client.leadNum" value="${esc(c.leadNum)}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <label class="col-span-2 text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">City</span>
        <input data-bind="client.city" value="${esc(c.city)}" class="w-full border border-slate-300 rounded-lg px-3 py-2 uppercase" placeholder="Auto-formatted in ALL CAPS on export"></label>
      <label class="col-span-2 text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Client Name</span>
        <input data-bind="client.name" value="${esc(c.name)}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <label class="text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Phone Number</span>
        <input data-bind="client.phone" value="${esc(c.phone)}" type="tel" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <label class="text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Email</span>
        <input data-bind="client.email" value="${esc(c.email)}" type="email" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <label class="text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Date</span>
        <input data-bind="client.date" value="${esc(c.date)}" type="date" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <div class="col-span-2 text-sm"><label for="arboristInput" class="block text-xs font-medium text-slate-500 mb-1">Arborist/ Sales Rep</label>
        <div class="relative" id="arboristBox">
          <input id="arboristInput" data-bind="client.arborist" value="${esc(c.arborist)}" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"
            placeholder="Pick or type a name" role="combobox" aria-expanded="false" aria-controls="arboristMenu" class="w-full border border-slate-300 rounded-lg pl-3 pr-10 py-2">
          <button type="button" data-arb-toggle aria-label="Show names" class="absolute inset-y-0 right-0 w-10 flex items-center justify-center text-slate-500">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
          <ul id="arboristMenu" role="listbox" style="scroll-margin-bottom:96px" class="hidden absolute z-20 left-0 right-0 mt-1 max-h-64 overflow-auto bg-white border border-slate-300 rounded-lg shadow-lg py-1"></ul>
        </div></div>
    </div>
  </div>`;
}

/* ===================== Arborist / Sales Rep picker =====================
   A text box with a dropdown of the standard names plus any names typed on this device before.
   Typing filters the list. The last name used becomes the default for new jobs. Stored in
   localStorage because it is a per-device preference, not part of the job. */
function arboristPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem(ARB_PREFS_KEY)||'{}');
    return { last: typeof p.last==='string' ? p.last : '', custom: Array.isArray(p.custom) ? p.custom.filter(n=>typeof n==='string' && n.trim()) : [] };
  }catch(e){ return { last:'', custom:[] }; }
}
function saveArboristPrefs(p){ try{ localStorage.setItem(ARB_PREFS_KEY, JSON.stringify(p)); }catch(e){} }
function arboristNames(){
  const names = ARBORISTS.slice();
  arboristPrefs().custom.forEach(n=>{ if(!names.some(x=>x.toLowerCase()===n.toLowerCase())) names.push(n); });
  return names;
}
/* Remember the name as the default, and add it to the list if it is new. */
function commitArborist(){
  const name = String(state.client.arborist||'').trim().replace(/\s+/g,' ');
  if(!name) return;
  const p = arboristPrefs();
  const match = arboristNames().find(x=>x.toLowerCase()===name.toLowerCase());
  if(!match) p.custom.push(name);
  p.last = match || name;
  saveArboristPrefs(p);
  // Tidy the job's copy too ("ian  bailey" -> "Ian Bailey").
  if(state.client.arborist!==p.last){
    state.client.arborist = p.last; persist();
    const input = document.getElementById('arboristInput'); if(input) input.value = p.last;
  }
}
function renderArboristMenu(showAll){
  const menu = document.getElementById('arboristMenu'), input = document.getElementById('arboristInput');
  if(!menu) return;
  const q = input.value.trim().toLowerCase();
  const custom = new Set(arboristPrefs().custom.map(n=>n.toLowerCase()));
  const all = arboristNames();
  const exact = all.some(n=>n.toLowerCase()===q);
  const names = (showAll || !q || exact) ? all : all.filter(n=>n.toLowerCase().includes(q));
  if(!names.length){ closeArboristMenu(); return; }
  menu.innerHTML = names.map(n=>{
    const cur = n.toLowerCase()===q;
    return `<li class="flex items-center ${cur?'bg-brand-light':''}">
      <button type="button" role="option" aria-selected="${cur}" data-arb-opt="${esc(n)}" class="flex-1 text-left px-3 py-2.5 ${cur?'font-semibold text-brand-dark':''}">${esc(n)}</button>

/* ===================== GPS capture =====================
   iOS only shows the location prompt when getCurrentPosition() runs directly inside a tap and the
   page is a secure context (https). Status is kept per tree id (not index) so a capture that finishes
   after trees are added/removed still lands on the right tree. Manual entry always remains available. */
const gpsBusy = new Set();
const gpsStatus = new Map(); // tree.id -> {kind:'ok'|'warn'|'error', msg}
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const IS_STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;

function gpsDeniedHelp(){
  if(IS_IOS){
    return 'Location permission is off. On iPhone: Settings → Privacy & Security → Location Services → ON, then '
      + (IS_STANDALONE ? 'scroll to "Safari Websites" (home-screen apps use Safari\'s setting) → "While Using the App". '
                       : '"Safari Websites" → "While Using the App". Also check Safari → aA menu → Website Settings → Location → Allow. ')
      + 'Then tap Capture GPS again, or type the coordinates above.';
  }
  return 'Location permission was denied. Allow location for this site in your browser settings, then tap Capture GPS again, or type the coordinates above.';
}
function gpsStatusHtml(tree){
  const st = gpsStatus.get(tree.id);
  if(!st) return '';
  const cls = st.kind==='ok' ? 'text-green-700 bg-green-50' : st.kind==='warn' ? 'text-amber-800 bg-amber-50' : 'text-red-700 bg-red-50';
  return `<p class="mt-2 text-xs rounded-lg px-2.5 py-2 ${cls}" data-gps-status="${tree.id}">${esc(st.msg)}</p>`;
}
function setGpsStatus(tree, kind, msg){ gpsStatus.set(tree.id, {kind, msg}); if(state.step===1) renderStepTrees(); }
function focusManualGps(tree){
  const ti = state.trees.indexOf(tree);
  const el = appRoot.querySelector(`[data-bind="trees.${ti}.gps.lat"]`);
  if(el) el.focus();
}

function captureGps(tree){
  if(!tree || gpsBusy.has(tree.id)) return;
  if(!window.isSecureContext){
    setGpsStatus(tree, 'error', 'GPS needs a secure (https://) connection. Open the app from its https:// address, or type the coordinates above.');
    focusManualGps(tree); return;
  }
  if(!('geolocation' in navigator)){
    setGpsStatus(tree, 'error', 'This browser does not support GPS. Type the coordinates above.');
    focusManualGps(tree); return;
  }
  gpsBusy.add(tree.id);

  const finish = ()=>{ gpsBusy.delete(tree.id); };
  const onSuccess = pos=>{
    finish();
    if(!state.trees.includes(tree)) return; // tree was removed meanwhile
    const acc = Math.round(pos.coords.accuracy);
    tree.gps = { lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6), accuracy: acc };
    persist();
    if(acc > 25) setGpsStatus(tree, 'warn', `Captured, but accuracy is weak (±${acc} m). Step into the open and capture again, or adjust manually.`);
    else setGpsStatus(tree, 'ok', `Captured (±${acc} m).`);
  };
  const onError = (err, triedFallback)=>{
    // Under heavy canopy a high-accuracy fix can time out; retry once accepting a coarser/recent fix.
    if(!triedFallback && err.code!==1){
      navigator.geolocation.getCurrentPosition(onSuccess, e2=>onError(e2, true), {enableHighAccuracy:false, timeout:15000, maximumAge:60000});
      return;
    }
    finish();
    const msg = err.code===1 ? gpsDeniedHelp()
      : err.code===2 ? 'Location unavailable (no GPS signal). Move into the open and try again, or type the coordinates above.'
      : err.code===3 ? 'GPS timed out. Try again in the open, or type the coordinates above.'
      : 'GPS failed: '+(err.message||'unknown error')+'. Type the coordinates above.';
    setGpsStatus(tree, 'error', msg);
    focusManualGps(tree);
  };
  // Must be called synchronously inside the tap handler for iOS to show its permission prompt.
  navigator.geolocation.getCurrentPosition(onSuccess, e=>onError(e, false), {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  setGpsStatus(tree, 'warn', 'Getting location… If asked, tap "Allow".');
}

/* Manual entry: accepts "38.9, -77.03" pasted into either box, or a value ending in N/S/E/W. */
function parseCoord(v, axis){
  if(v==null) return null;
  let s = String(v).trim().toUpperCase().replace(/°/g,'');
  if(!s) return null;
  let sign = 1;
  if(/[SW]$/.test(s)) sign = -1;
  s = s.replace(/[NSEW]$/,'').trim();
  const n = Number(s);
  if(!s || !isFinite(n)) return NaN;
  const val = sign*n;
  return Math.abs(val) <= (axis==='lat' ? 90 : 180) ? val : NaN;
}
function onManualGpsChange(input){
  const m = input.getAttribute('data-bind').match(/^trees\.(\d+)\.gps\.(lat|lng)$/);
  if(!m) return;
  const tree = state.trees[Number(m[1])];
  if(input.value.includes(',')){
    const pair = input.value.split(',').map(x=>x.trim()).filter(Boolean);
    const la = parseCoord(pair[0],'lat'), ln = parseCoord(pair[1],'lng');
    if(pair.length===2 && isFinite(la) && la!==null && isFinite(ln) && ln!==null){
      tree.gps = { lat: la.toFixed(6), lng: ln.toFixed(6), accuracy: '' };
      persist(); setGpsStatus(tree, 'ok', 'Coordinates entered manually.'); return;
    }
  }
  const field = m[2];
  const val = parseCoord(input.value, field);
  if(val===null){ tree.gps[field] = ''; persist(); gpsStatus.delete(tree.id); renderStepTrees(); return; }
  if(isNaN(val)){
    setGpsStatus(tree, 'error', `That ${field==='lat'?'latitude':'longitude'} isn't valid. Use decimal degrees, e.g. ${field==='lat'?'38.904722':'-77.016389'}.`);
    return;
  }
  tree.gps[field] = val.toFixed(6);
  persist();
  if(tree.gps.lat && tree.gps.lng) setGpsStatus(tree, 'ok', 'Coordinates entered manually.');
  else { gpsStatus.delete(tree.id); renderStepTrees(); }
}

  if(state.equipment.spyderLift.needed) total += Number(state.equipment.spyderLift.price)||0;
  appRoot.innerHTML = `
  <div class="bg-white rounded-xl border border-slate-200 p-5 space-y-4 text-center">
    <h2 class="text-base font-bold text-slate-700">Review & Generate Output Package</h2>
    <p class="text-sm text-slate-500">${state.trees.length} tree(s) · Grand Total <span class="font-bold text-brand">${money(total)}</span></p>
    <button id="genZipBtn" class="w-full bg-brand text-white font-bold rounded-xl py-3.5">Generate &amp; Download ZIP Bundle</button>
    <div class="grid grid-cols-2 gap-2 pt-1">
      <button id="genPdfBtn" class="bg-slate-100 text-slate-700 text-sm font-medium rounded-lg py-2.5">PDF Report only</button>
      <button id="genCardBtn" class="bg-slate-100 text-slate-700 text-sm font-medium rounded-lg py-2.5">Notecard PDF only</button>
    </div>
    <p class="text-xs text-slate-400 pt-2">ZIP includes: main report PDF, 5x7 notecard PDF, GeoJSON + CSV coordinates, and a media folder of original + annotated photos.</p>
  </div>`;
}

/* ===================== Event delegation ===================== */
appRoot.addEventListener('input', handleBind);
appRoot.addEventListener('change', handleBind);
function handleBind(e){
  const path = e.target.getAttribute('data-bind');
  if(!path) return;
  const val = e.target.type==='checkbox' ? e.target.checked : e.target.value;
  setPath(state, path, val);
  persist();
  if(path==='client.name' || path==='client.city') updateSubtitle();
  const priceMatch = path.match(/^trees\.(\d+)\.(?:tasks\.\d+\.)?price$/);
  if(priceMatch){
    const ti = Number(priceMatch[1]);
    const el = appRoot.querySelector(`[data-tree-subtotal="${ti}"]`);
    if(el) el.textContent = money(treeSubtotal(state.trees[ti]));
  }
  if(e.target.type==='checkbox' && (path.startsWith('equipment.crane.needed')||path.startsWith('equipment.spyderLift.needed'))){
    renderStepLogistics();
  }
  if(path.includes('.type') && e.target.tagName==='SELECT'){
    renderStepTrees();
  }
}

/* ===================== Photo Doodle Editor =====================
   Coordinates: shapes are stored in image pixels (0..width, 0..height). The view maps them to the
   canvas with a fit scale (baseScale) times the user zoom (scale), plus a pan offset.
   Gestures: two fingers pinch/pan in every tool; mouse wheel zooms; in Select, dragging empty
   space pans; middle/right mouse drag pans in any tool; double-tap empty space fits the photo.
   Sizes on the sliders are in "units" of 1/900 of the photo's long edge, so a setting looks the
   same on any photo resolution. */
const edModal = document.getElementById('editorModal');
const edCanvas = document.getElementById('editorCanvas');
const edCtx = edCanvas.getContext('2d');
const edOptionsEl = document.getElementById('edOptions');
const measureCtx = document.createElement('canvas').getContext('2d');
let ed = null; // current editor session
let edTarget = null; // {treeIdx, taskIdx|null, role}
// Tool settings persist between photos for the rest of the session.
const edOpts = { color: COLORS[0], width: 4, font: 30, magR: 55, magZoom: 2.5, shapeKind: 'rect' };
const SHAPE_KINDS = [['rect','▭','Rectangle'],['ellipse','◯','Ellipse'],['line','╱','Line'],['arrow','➜','Arrow']];
const TWO_POINT = new Set(['rect','ellipse','line','arrow']);
const STROKED = new Set(['freehand','rect','ellipse','line','arrow']);

function dpr(){ return window.devicePixelRatio || 1; }
function newShapeId(){ return 'sh'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function unit(){ return Math.max(ed.img.width, ed.img.height)/900; }
function eff(){ return ed.baseScale*ed.scale; }
function tolImg(cssPx){ return cssPx*dpr()/eff(); } // a distance in screen CSS px, expressed in image px

function findPhoto(target){
  const tree = state.trees[target.treeIdx];
  return target.role==='main' ? tree.mainPhoto : tree.tasks[target.taskIdx].photo;
}

function openEditorFromEl(el){
  edTarget = { treeIdx: Number(el.dataset.treeIdx), taskIdx: el.dataset.taskIdx!=null ? Number(el.dataset.taskIdx) : null, role: el.dataset.role };
  const photo = findPhoto(edTarget);
  if(!photo || !photo.originalDataUrl){ toast('No photo to edit yet.'); return; }
  const img = new Image();
  img.onload = ()=>{
    edModal.classList.remove('hidden');
    sizeEditorCanvas();
    ed = {
      img, scale:1, baseScale:1, panX:0, panY:0, tool:'draw',
      shapes: JSON.parse(JSON.stringify(photo.shapes||[])),
      selectedId:null, pointers:new Map(), gesture:null, undo:[], snapKey:null, lastTap:null
    };
    ed.baseScale = fitScale();
    buildSwatches();
    setActiveTool(ed.shapes.length ? 'select' : 'draw');
  };
  img.src = photo.originalDataUrl;
}
function fitScale(){ return Math.min(edCanvas.width/ed.img.width, edCanvas.height/ed.img.height); }
function sizeEditorCanvas(){
  const wrap = document.getElementById('edCanvasWrap');
  edCanvas.width = Math.round(wrap.clientWidth*dpr());
  edCanvas.height = Math.round(wrap.clientHeight*dpr());
  edCanvas.style.width = wrap.clientWidth+'px';
  edCanvas.style.height = wrap.clientHeight+'px';
}
function resetView(){ ed.scale=1; ed.panX=0; ed.panY=0; redrawEditor(); }

/* ---------- Toolbar, options, swatches ---------- */
function selectedShape(){ return ed && ed.selectedId!=null ? ed.shapes.find(s=>s.id===ed.selectedId) || null : null; }
function selectShape(s){ ed.selectedId = s ? s.id : null; ed.snapKey = null; renderEdOptions(); }

function setActiveTool(tool){
  ed.tool = tool;
  ed.selectedId = null;
  document.querySelectorAll('#edToolRow [data-tool]').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.tool===tool)));
  renderEdOptions();
  redrawEditor();
}
document.getElementById('edToolRow').addEventListener('click', e=>{
  const btn = e.target.closest('[data-tool]'); if(!btn || !ed) return;
  setActiveTool(btn.dataset.tool);
});

function sliderHtml(key, label, min, max, step, val, suffix){
  return `<label class="flex items-center gap-2 text-xs text-slate-200 flex-1 min-w-[150px]">
    <span class="shrink-0">${label}</span>
    <input type="range" data-opt="${key}" min="${min}" max="${max}" step="${step}" value="${val}" class="flex-1 min-w-0 accent-blue-500">
    <span class="w-9 text-right tabular-nums" data-opt-val="${key}">${val}${suffix||''}</span></label>`;
}
function renderEdOptions(){
  if(!ed) return;
  const s = selectedShape(), u = unit(), parts = [];
  const kind = s ? s.type : ed.tool;
  if(!s && ed.tool==='shapes'){
    parts.push(`<div class="flex gap-1">${SHAPE_KINDS.map(([k,icon,name])=>
      `<button data-shape-kind="${k}" title="${name}" aria-pressed="${edOpts.shapeKind===k}" class="tool-btn w-9 h-8 rounded bg-slate-700 text-base leading-none">${icon}</button>`).join('')}</div>`);
  }
  if(kind==='draw' || kind==='shapes' || STROKED.has(kind)){
    parts.push(sliderHtml('width', 'Line', 1, 20, 1, s ? Math.max(1, Math.round(s.width/u)) : edOpts.width));
  }
  if(kind==='text'){
    parts.push(sliderHtml('font', 'Font', 10, 100, 2, s ? Math.round(s.fontSize/u) : edOpts.font));
    if(s) parts.push(`<button data-edit-text class="px-2.5 py-1.5 rounded bg-slate-700 text-xs">✎ Edit text</button>`);
  }
  if(kind==='magnify' || kind==='circle'){
    parts.push(sliderHtml('magR', 'Size', 20, 200, 5, s ? Math.round(s.r/u) : edOpts.magR));
    parts.push(sliderHtml('magZoom', 'Zoom', 1.5, 4, 0.25, s ? s.mag : edOpts.magZoom, '×'));
  }
  if(!parts.length){
    parts.push(`<span class="text-xs text-slate-400">Tap a mark to select it · drag to move · tap selected text to edit</span>`);
  }
  if(s) parts.unshift(`<span class="text-[11px] uppercase tracking-wide text-blue-300">Selected</span>`);
  edOptionsEl.innerHTML = parts.join('');
  document.getElementById('edDeleteBtn').disabled = !s;
}
edOptionsEl.addEventListener('input', e=>{
  const key = e.target.dataset && e.target.dataset.opt; if(!key || !ed) return;
  const v = Number(e.target.value);
  edOpts[key] = v;
  const lbl = edOptionsEl.querySelector(`[data-opt-val="${key}"]`); if(lbl) lbl.textContent = v + (key==='magZoom'?'×':'');
  const s = selectedShape();
  if(s){ applyOpt(s, key, v); redrawEditor(); }
});
edOptionsEl.addEventListener('click', e=>{
  if(!ed) return;
  const kindBtn = e.target.closest('[data-shape-kind]');
  if(kindBtn){ edOpts.shapeKind = kindBtn.dataset.shapeKind; renderEdOptions(); return; }
  if(e.target.closest('[data-edit-text]')){ const s = selectedShape(); if(s) editText(s); }
});
function applyOpt(s, key, v){
  const u = unit();
  const snap = 'prop:'+s.id+':'+key;
  if(ed.snapKey!==snap){ pushUndo(); ed.snapKey = snap; } // one undo step per slider drag
  if(key==='width' && STROKED.has(s.type)) s.width = v*u;
  else if(key==='font' && s.type==='text') s.fontSize = v*u;
  else if(key==='magR' && s.type==='circle') s.r = v*u;
  else if(key==='magZoom' && s.type==='circle') s.mag = v;
}
function buildSwatches(){
  const row = document.getElementById('edSwatches');
  const s = ed && selectedShape();
  const current = s ? s.color : edOpts.color;
  row.innerHTML = COLORS.map(c=>`<button class="swatch" data-color="${c}" style="background:${c}" aria-pressed="${current===c}"></button>`).join('');
}
document.getElementById('edSwatches').addEventListener('click', e=>{
  const sw = e.target.closest('[data-color]'); if(!sw || !ed) return;
  edOpts.color = sw.dataset.color;
  const s = selectedShape();
  if(s){ const snap='color:'+s.id; if(ed.snapKey!==snap){ pushUndo(); ed.snapKey=snap; } s.color = edOpts.color; redrawEditor(); }
  buildSwatches();
});

/* ---------- Undo ---------- */
function pushUndo(){ ed.undo.push(JSON.stringify(ed.shapes)); if(ed.undo.length>80) ed.undo.shift(); }
function updateEditButtons(){
  document.getElementById('edUndoBtn').disabled = !ed.undo.length;
  document.getElementById('edClearBtn').disabled = !ed.shapes.length;
  document.getElementById('edDeleteBtn').disabled = !selectedShape();
}
function editorUndo(){
  if(!ed || !ed.undo.length) return;
  ed.shapes = JSON.parse(ed.undo.pop());
  if(!selectedShape()) ed.selectedId = null;
  ed.snapKey = null;
  renderEdOptions(); buildSwatches(); redrawEditor();
}
function editorDeleteSelected(){
  const s = selectedShape(); if(!s) return;
  pushUndo(); ed.shapes = ed.shapes.filter(x=>x!==s); selectShape(null); buildSwatches(); redrawEditor();
}
document.getElementById('edUndoBtn').addEventListener('click', editorUndo);
document.getElementById('edClearBtn').addEventListener('click', ()=>{
  if(!ed || !ed.shapes.length) return;
  pushUndo(); ed.shapes = []; selectShape(null); redrawEditor(); toast('Cleared. Tap Undo to bring the marks back.');
});
document.getElementById('edDeleteBtn').addEventListener('click', editorDeleteSelected);
document.getElementById('edFitBtn').addEventListener('click', ()=>{ if(ed) resetView(); });
document.addEventListener('keydown', e=>{
  if(!ed || edModal.classList.contains('hidden')) return;
  if((e.key==='Delete' || e.key==='Backspace') && selectedShape()){ e.preventDefault(); editorDeleteSelected(); }
  else if(e.key==='Escape'){ selectShape(null); buildSwatches(); redrawEditor(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); editorUndo(); }
});

function editText(s){
  const txt = prompt('Edit text:', s.text);
  if(txt==null) return;
  pushUndo();
  if(!txt.trim()){ ed.shapes = ed.shapes.filter(x=>x!==s); selectShape(null); }
  else s.text = txt.trim();
  redrawEditor();
}

/* ---------- Coordinates ---------- */
function canvasPointFromEvent(evt){
  const rect = edCanvas.getBoundingClientRect();
  return { cx: (evt.clientX-rect.left)*(edCanvas.width/rect.width), cy: (evt.clientY-rect.top)*(edCanvas.height/rect.height) };
}
function toImageSpace(cx,cy){
  const e = eff();
  return { x: (cx - edCanvas.width/2 - ed.panX)/e + ed.img.width/2, y: (cy - edCanvas.height/2 - ed.panY)/e + ed.img.height/2 };
}
/* Zoom to newScale keeping image point imgPt under canvas point c. */
function zoomAround(c, imgPt, newScale){
  newScale = Math.max(0.5, Math.min(8, newScale));
  const e2 = ed.baseScale*newScale;
  ed.panX = c.cx - edCanvas.width/2 - (imgPt.x - ed.img.width/2)*e2;
  ed.panY = c.cy - edCanvas.height/2 - (imgPt.y - ed.img.height/2)*e2;
  ed.scale = newScale;
}

/* ---------- Rendering ---------- */
function redrawEditor(){
  if(!ed) return;
  edCtx.setTransform(1,0,0,1,0,0);
  edCtx.fillStyle = '#111'; edCtx.fillRect(0,0,edCanvas.width,edCanvas.height);
  const e = eff();
  edCtx.save();
  edCtx.translate(edCanvas.width/2+ed.panX, edCanvas.height/2+ed.panY);
  edCtx.scale(e,e);
  edCtx.translate(-ed.img.width/2, -ed.img.height/2);
  paintScene(edCtx, ed.img, ed.shapes, ed.selectedId, e);
  if(ed.gesture && ed.gesture.mode==='draw') drawShape(edCtx, ed.img, ed.gesture.shape, false, e);
  edCtx.restore();
  updateEditButtons();
}
/* Draws the photo plus annotations in image-space coordinates (0..width, 0..height). */
function paintScene(ctx, img, shapes, selectedId, zoom){
  ctx.drawImage(img, 0, 0);
  shapes.forEach(s=>drawShape(ctx, img, s, s.id===selectedId, zoom));
}
/* Full-resolution flattened copy of the photo with annotations, for the PDF/ZIP. */
function renderFlattened(img, shapes){
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  paintScene(c.getContext('2d'), img, shapes, null, 1);
  return c.toDataURL('image/jpeg', 0.88);
}
function drawArrowHead(ctx, s){
  const ang = Math.atan2(s.y2-s.y1, s.x2-s.x1); const head = s.width*4+10;
  ctx.beginPath();
  ctx.moveTo(s.x2, s.y2);
  ctx.lineTo(s.x2 - head*Math.cos(ang-Math.PI/7), s.y2 - head*Math.sin(ang-Math.PI/7));
  ctx.lineTo(s.x2 - head*Math.cos(ang+Math.PI/7), s.y2 - head*Math.sin(ang+Math.PI/7));
  ctx.closePath(); ctx.fill();
}
function drawShape(ctx, img, s, selected, zoom){
  ctx.save();
  ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
  ctx.lineWidth = s.width || 1; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if(s.type==='freehand'){
    const pts = s.points||[];
    ctx.beginPath();
    pts.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    if(pts.length===1) ctx.lineTo(pts[0].x+0.01, pts[0].y);
    ctx.stroke();
  } else if(s.type==='rect'){
    const b = shapeBounds(s);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  } else if(s.type==='ellipse'){
    const b = shapeBounds(s);
    ctx.beginPath(); ctx.ellipse(b.x+b.w/2, b.y+b.h/2, Math.max(0.5,b.w/2), Math.max(0.5,b.h/2), 0, 0, Math.PI*2); ctx.stroke();
  } else if(s.type==='line'){
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
  } else if(s.type==='arrow'){
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    drawArrowHead(ctx, s);
  } else if(s.type==='text'){
    ctx.font = 'bold '+s.fontSize+'px Arial, sans-serif'; ctx.textBaseline='top';
    ctx.lineWidth = Math.max(2, s.fontSize*0.12);
    ctx.strokeStyle = (s.color==='#111111') ? '#FFFFFF' : '#000000';
    ctx.strokeText(s.text, s.x, s.y);
    ctx.fillText(s.text, s.x, s.y);
  } else if(s.type==='circle'){
    ctx.save();
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.clip();
    ctx.translate(s.x, s.y); ctx.scale(s.mag, s.mag); ctx.translate(-s.x, -s.y);
    ctx.drawImage(img, 0, 0);
    ctx.restore();
    ctx.lineWidth = Math.max(2, s.r*0.03);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.stroke();
  }
  if(selected){
    const px = dpr()/zoom; // one screen CSS pixel, in image px
    ctx.strokeStyle = '#1A73E8'; ctx.lineWidth = 2*px; ctx.setLineDash([6*px,4*px]);
    if(s.type!=='line' && s.type!=='arrow'){ // lines/arrows show only their endpoint handles
      const b = shapeBounds(s), pad = 6*px;
      ctx.strokeRect(b.x-pad, b.y-pad, b.w+pad*2, b.h+pad*2);
    }
    ctx.setLineDash([]);
    if(TWO_POINT.has(s.type)){
      [[s.x1,s.y1],[s.x2,s.y2]].forEach(([hx,hy])=>{
        ctx.beginPath(); ctx.arc(hx, hy, 9*px, 0, Math.PI*2);
        ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.lineWidth = 2.5*px; ctx.strokeStyle = '#1A73E8'; ctx.stroke();
      });
    }
  }
  ctx.restore();
}
function textWidth(s){ measureCtx.font = 'bold '+s.fontSize+'px Arial, sans-serif'; return measureCtx.measureText(s.text).width; }
function shapeBounds(s){
  if(s.type==='text') return { x:s.x, y:s.y, w: textWidth(s), h: s.fontSize*1.1 };
  if(s.type==='circle') return { x:s.x-s.r, y:s.y-s.r, w:s.r*2, h:s.r*2 };
  if(TWO_POINT.has(s.type)) return { x:Math.min(s.x1,s.x2), y:Math.min(s.y1,s.y2), w:Math.abs(s.x2-s.x1), h:Math.abs(s.y2-s.y1) };
  const xs = s.points.map(p=>p.x), ys = s.points.map(p=>p.y);
  return { x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys) };
}
function hitTest(ix,iy){
  const tol = tolImg(12);
  for(let i=ed.shapes.length-1;i>=0;i--){
    const s = ed.shapes[i];
    if(s.type==='text' || s.type==='rect' || s.type==='ellipse'){
      const b = shapeBounds(s), t = tol + (s.width||0)/2;
      if(ix>=b.x-t && ix<=b.x+b.w+t && iy>=b.y-t && iy<=b.y+b.h+t) return s;
    }
    else if(s.type==='circle'){ if(Math.hypot(ix-s.x, iy-s.y) <= s.r+tol) return s; }
    else if(s.type==='line' || s.type==='arrow'){ if(distToSeg(ix,iy,s.x1,s.y1,s.x2,s.y2) <= tol+s.width/2) return s; }
    else if(s.type==='freehand'){
      const pts = s.points;
      if(pts.length===1 && Math.hypot(ix-pts[0].x, iy-pts[0].y) <= tol+s.width/2) return s;
      for(let j=0;j<pts.length-1;j++){ if(distToSeg(ix,iy,pts[j].x,pts[j].y,pts[j+1].x,pts[j+1].y) <= tol+s.width/2) return s; }
    }
  }
  return null;
}
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1; const len2 = dx*dx+dy*dy;
  let t = len2 ? ((px-x1)*dx+(py-y1)*dy)/len2 : 0; t = Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function moveShapeBy(s, dx, dy){
  if(s.type==='text'||s.type==='circle'){ s.x+=dx; s.y+=dy; }
  else if(TWO_POINT.has(s.type)){ s.x1+=dx; s.y1+=dy; s.x2+=dx; s.y2+=dy; }
  else if(s.type==='freehand'){ s.points.forEach(p=>{ p.x+=dx; p.y+=dy; }); }
}

/* ---------- Pointer gestures ---------- */
function startPinch(){
  const [a,b] = Array.from(ed.pointers.values());
  const mid = {cx:(a.cx+b.cx)/2, cy:(a.cy+b.cy)/2};
  ed.gesture = { mode:'pinch', dist0: Math.hypot(a.cx-b.cx, a.cy-b.cy) || 1, scale0: ed.scale, imgMid: toImageSpace(mid.cx, mid.cy) };
}
edCanvas.addEventListener('pointerdown', e=>{
  if(!ed) return;
  e.preventDefault();
  try{ edCanvas.setPointerCapture(e.pointerId); }catch(err){}
  const p = canvasPointFromEvent(e);
  ed.pointers.set(e.pointerId, p);
  ed.snapKey = null;
  if(ed.pointers.size===2){ startPinch(); redrawEditor(); return; } // drops any in-progress stroke
  if(ed.pointers.size>2) return;
  const img = toImageSpace(p.cx, p.cy);

  if(e.pointerType==='mouse' && e.button!==0){ ed.gesture = { mode:'pan', start:p, panX:ed.panX, panY:ed.panY }; return; }

  // Endpoint handles of a selected line/arrow/rect/ellipse can be dragged in any tool.
  const sel = selectedShape();
  if(sel && TWO_POINT.has(sel.type)){
    const r = tolImg(20);
    const which = Math.hypot(img.x-sel.x2, img.y-sel.y2)<=r ? 2 : Math.hypot(img.x-sel.x1, img.y-sel.y1)<=r ? 1 : 0;
    if(which){ ed.gesture = { mode:'handle', shape:sel, which, started:false, start:p }; return; }
  }

  const tool = ed.tool;
  if(tool==='select' || tool==='text' || tool==='magnify'){
    const want = tool==='text' ? 'text' : tool==='magnify' ? 'circle' : null;
    const hit = hitTest(img.x, img.y);
    if(hit && (!want || hit.type===want)){
      const wasSelected = ed.selectedId===hit.id;
      selectShape(hit); buildSwatches();
      ed.gesture = { mode:'move', shape:hit, last:img, start:p, moved:false, wasSelected };
      redrawEditor(); return;
    }
    if(tool==='select'){
      if(ed.selectedId!=null){ selectShape(null); buildSwatches(); redrawEditor(); }
      ed.gesture = { mode:'pan', start:p, panX:ed.panX, panY:ed.panY, empty:true, moved:false };
      return;
    }
    ed.gesture = { mode:'tap', start:p, img, moved:false };
    return;
  }
  if(tool==='draw' || tool==='shapes'){
    if(ed.selectedId!=null){ selectShape(null); buildSwatches(); }
    const base = { id:newShapeId(), color:edOpts.color, width:edOpts.width*unit() };
    const shape = tool==='draw'
      ? Object.assign(base, { type:'freehand', points:[{x:img.x, y:img.y}] })
      : Object.assign(base, { type:edOpts.shapeKind, x1:img.x, y1:img.y, x2:img.x, y2:img.y });
    ed.gesture = { mode:'draw', shape };
    redrawEditor();
  }
});
edCanvas.addEventListener('pointermove', e=>{
  if(!ed || !ed.pointers.has(e.pointerId)) return;
  const p = canvasPointFromEvent(e);
  ed.pointers.set(e.pointerId, p);
  const g = ed.gesture;
  if(!g) return;
  if(g.mode==='pinch'){
    if(ed.pointers.size<2) return;
    const [a,b] = Array.from(ed.pointers.values());
    zoomAround({cx:(a.cx+b.cx)/2, cy:(a.cy+b.cy)/2}, g.imgMid, g.scale0*Math.hypot(a.cx-b.cx, a.cy-b.cy)/g.dist0);
    redrawEditor(); return;
  }
  if(ed.pointers.size!==1) return;
  const img = toImageSpace(p.cx, p.cy);
  const farFromStart = g.start ? Math.hypot(p.cx-g.start.cx, p.cy-g.start.cy) > 6*dpr() : true;
  if(g.mode==='pan'){
    ed.panX = g.panX + (p.cx-g.start.cx); ed.panY = g.panY + (p.cy-g.start.cy);
    if(farFromStart) g.moved = true;
  } else if(g.mode==='move'){
    if(!g.moved){ if(!farFromStart) return; pushUndo(); g.moved = true; }
    moveShapeBy(g.shape, img.x-g.last.x, img.y-g.last.y); g.last = img;
  } else if(g.mode==='handle'){
    if(!g.started){ pushUndo(); g.started = true; }
    g.shape['x'+g.which] = img.x; g.shape['y'+g.which] = img.y;
  } else if(g.mode==='draw'){
    const s = g.shape;
    if(s.type==='freehand'){
      const last = s.points[s.points.length-1];
      if(Math.hypot(img.x-last.x, img.y-last.y) >= 0.5*unit()) s.points.push({x:img.x, y:img.y});
    } else { s.x2 = img.x; s.y2 = img.y; }
  } else if(g.mode==='tap'){
    if(farFromStart) g.moved = true;
    return;
  }
  redrawEditor();
});
function endPointer(e){
  if(!ed || !ed.pointers.has(e.pointerId)) return;
  ed.pointers.delete(e.pointerId);
  const g = ed.gesture;
  if(g && g.mode==='pinch'){
    // Stay in pinch until every finger lifts so a leftover finger doesn't draw or pan.
    if(ed.pointers.size===0) ed.gesture = null;
    return;
  }
  if(ed.pointers.size>0) return;
  ed.gesture = null;
  if(!g) return;
  const cancelled = e.type==='pointercancel';
  const p = canvasPointFromEvent(e);
  if(g.mode==='draw' && !cancelled){
    const s = g.shape;
    const big = s.type==='freehand' || Math.hypot(s.x2-s.x1, s.y2-s.y1) >= Math.max(tolImg(10), s.width*2);
    if(big){
      pushUndo(); ed.shapes.push(s);
      if(s.type!=='freehand'){ selectShape(s); buildSwatches(); }
    }
  } else if(g.mode==='tap' && !g.moved && !cancelled){
    if(ed.tool==='text'){
      const txt = prompt('Enter text:');
      if(txt && txt.trim()){
        pushUndo();
        const s = { id:newShapeId(), type:'text', x:g.img.x, y:g.img.y, text:txt.trim(), color:edOpts.color, fontSize:edOpts.font*unit() };
        ed.shapes.push(s); selectShape(s); buildSwatches();
      }
    } else if(ed.tool==='magnify'){
      pushUndo();
      const s = { id:newShapeId(), type:'circle', x:g.img.x, y:g.img.y, r:edOpts.magR*unit(), mag:edOpts.magZoom, color:edOpts.color };
      ed.shapes.push(s); selectShape(s); buildSwatches();
    }
  } else if(g.mode==='move' && !g.moved && g.wasSelected && g.shape.type==='text' && !cancelled){
    editText(g.shape); // tap on already-selected text edits it
  } else if(g.mode==='pan' && g.empty && !g.moved && !cancelled){
    const now = Date.now();
    if(ed.lastTap && now-ed.lastTap.t < 350 && Math.hypot(p.cx-ed.lastTap.cx, p.cy-ed.lastTap.cy) < 30*dpr()){ ed.lastTap = null; resetView(); }
    else ed.lastTap = { t:now, cx:p.cx, cy:p.cy };
  }
  redrawEditor();
}
edCanvas.addEventListener('pointerup', endPointer);
edCanvas.addEventListener('pointercancel', endPointer);
edCanvas.addEventListener('contextmenu', e=>e.preventDefault());
edCanvas.addEventListener('dblclick', e=>{
  if(!ed) return;
  const p = canvasPointFromEvent(e), img = toImageSpace(p.cx, p.cy);
  if(!hitTest(img.x, img.y) && ed.tool!=='text' && ed.tool!=='magnify') resetView();
});
edCanvas.addEventListener('wheel', e=>{
  if(!ed) return;
  e.preventDefault();
  const p = canvasPointFromEvent(e);
  const factor = Math.exp(-e.deltaY*(e.deltaMode===1 ? 0.05 : 0.0015));
  zoomAround(p, toImageSpace(p.cx, p.cy), ed.scale*factor);
  redrawEditor();
}, {passive:false});

/* ===================== Site map (relative positions from GPS) ===================== */
function geoPoints() {
  return state.trees
    .map((t, i) => ({ i, t, lat: parseFloat(t.gps.lat), lng: parseFloat(t.gps.lng) }))
    .filter(p => isFinite(p.lat) && isFinite(p.lng));
}
function toLocalXY(lat, lng, originLat, originLng) {
  const R = 6371000;
  const dLat = (lat - originLat) * Math.PI / 180;
  const dLng = (lng - originLng) * Math.PI / 180;
  return { x: dLng * Math.cos(originLat * Math.PI / 180) * R, y: dLat * R };
}
function niceRoundScale(v) {
  if (v <= 0) return 5;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / pow;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * pow;
}
function renderSiteMapCanvas(width = 600, height = 440) {
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#EAF1FB'; ctx.fillRect(0, 0, width, height);

  const pts = geoPoints();
  if (!pts.length) {
    ctx.fillStyle = '#1A73E8'; ctx.font = '16px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('No GPS coordinates captured yet', width / 2, height / 2);
    return canvas;
  }

  const originLat = pts.reduce((s, p) => s + p.lat, 0) / pts.length;
  const originLng = pts.reduce((s, p) => s + p.lng, 0) / pts.length;
  const xy = pts.map(p => Object.assign({}, p, toLocalXY(p.lat, p.lng, originLat, originLng)));

  const pad = 50;
  const xs = xy.map(p => p.x), ys = xy.map(p => p.y);
  let minX = Math.min(...xs, -5), maxX = Math.max(...xs, 5);
  let minY = Math.min(...ys, -5), maxY = Math.max(...ys, 5);
  const span = Math.max(maxX - minX, maxY - minY, 10);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

  const pxPerM = Math.min(width - 2 * pad, height - 2 * pad) / span;
  function project(x, y) {
    return [width / 2 + (x - cx) * pxPerM, height / 2 - (y - cy) * pxPerM];
  }

  ctx.strokeStyle = '#AECBFA'; ctx.lineWidth = 1;
  ctx.strokeRect(pad, pad, width - 2 * pad, height - 2 * pad);

  const scaleMeters = niceRoundScale(span / 4);
  const scalePx = scaleMeters * pxPerM;
  ctx.strokeStyle = '#1A73E8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, height - 20); ctx.lineTo(pad + scalePx, height - 20); ctx.stroke();
  ctx.fillStyle = '#1A73E8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(`${scaleMeters} m`, pad, height - 26);

  ctx.save();
  ctx.translate(width - 30, 36);
  ctx.strokeStyle = '#1A73E8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, -14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-5, -5); ctx.lineTo(5, -5); ctx.closePath();
  ctx.fillStyle = '#1A73E8'; ctx.fill();
  ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('N', 0, -18);
  ctx.restore();

  const k = Math.max(1, width / 600);
  xy.forEach(p => {
    const [px, py] = project(p.x, p.y);
    ctx.beginPath(); ctx.arc(px, py, 10 * k, 0, Math.PI * 2);
    ctx.fillStyle = '#1A73E8'; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.font = `bold ${Math.round(10 * k)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(p.i + 1), px, py + 1);
    ctx.fillStyle = '#0B1220'; ctx.font = `bold ${Math.round(10 * k)}px sans-serif`; ctx.textBaseline = 'alphabetic';
    ctx.fillText(treeLabel(p.i), px, py + 24 * k);
    ctx.font = `${Math.round(9 * k)}px sans-serif`;
    if (p.t.species) ctx.fillText(p.t.species.slice(0, 22), px, py + 36 * k);
  });
  return canvas;
}

/* ===================== PDF generation ===================== */
function taskTypeLabel(task){ return task.type==='Other (specify)' ? (task.customType||'Other') : task.type; }

/* Photo labels match the SingleOps inventory: "[SingleOps #]-1" for tree 1's photo, "[SingleOps #]-1a"
   for its task 1a. Without a SingleOps # they fall back to "Tree #1" and "1a". In the report text,
   trees are "Tree #1" and tasks "1a", "1b". */
function taskLetter(tj){ return String.fromCharCode(97+tj); }
function treeLabel(ti){ const lead = String(state.client.leadNum||'').trim(); return lead ? `${lead}-${ti+1}` : `Tree #${ti+1}`; }
function taskLabel(ti, tj){ const lead = String(state.client.leadNum||'').trim(); return (lead ? `${lead}-` : '') + (ti+1) + taskLetter(tj); }
function photoSrc(photo){ return photo ? (photo.editedDataUrl || photo.originalDataUrl || null) : null; }

/* Selected equipment as [name, detail] pairs, in the order shown in the app. */
function selectedEquipment(){
  const eq = state.equipment, out = [];
  if(eq.bucketTruck!=='None') out.push(['Bucket Truck', eq.bucketTruck]);
  if(eq.chipper!=='None') out.push(['Chipper', eq.chipper]);
  if(eq.chipTruck!=='None') out.push(['Chip Truck', eq.chipTruck]);
  if(eq.extraChipTruck!=='No') out.push(['Extra Chip Truck', eq.extraChipTruck.replace(/^Yes - /,'')]);
  if(eq.stumpGrinder!=='None') out.push(['Stump Grinder', eq.stumpGrinder]);
  if(eq.miniLoader!=='None') out.push(['Mini Loader', eq.miniLoader]);
  if(eq.shuttleVehicle==='Yes') out.push(['Shuttle Vehicle', '']);
  if(eq.crane.needed) out.push(['Crane', eq.crane.spec||'']);
  if(eq.spyderLift.needed) out.push(['Spyder Lift', '']);
  return out;
}
/* Checked access & permit items, standard ones first. */
function selectedAccessPermits(){
  const out = ACCESS_ITEMS.filter(([k])=>state.accessPermits.standard[k]).map(([,l])=>l);
  state.accessPermits.custom.forEach(c=>{ if(c.checked && String(c.label||'').trim()) out.push(c.label.trim()); });
  return out;
}
/* Tags for the SingleOps proposal: equipment, access & permits, and crew size. */
function jobTags(){
  const tags = selectedEquipment().map(([n,d])=>d ? `${n} ${d}` : n);
  selectedAccessPermits().forEach(a=>tags.push(a));
  const crew = String(state.client.crewSize||'').trim();
  if(crew) tags.push('Crew: '+crew);
  return tags;
}

/* Work type for the title, summarised from the job's tasks in the order they first appear. */
const WORK_TYPE_GROUPS = [
  [/^Prune/, 'Pruning'], [/^Removal - Full/, 'Take Down'], [/^Removal/, 'Hazard Limb Removal'],
  [/^Stump/, 'Stump Grinding'], [/^Cabling/, 'Cabling'], [/^Root Collar/, 'Root Collar Excavation'],
  [/^PHC/, 'PHC'], [/^Planting/, 'Planting'], [/^Mulching/, 'Mulching']
];
const SUPPORT_TASKS = /^(Haul Wood|Chip Debris)/;
function jobWorkTypes(){
  const types = [];
  const add = t=>{ if(t && !types.includes(t)) types.push(t); };
  state.trees.forEach(tree=>tree.tasks.forEach(task=>{
    if(task.type==='Other (specify)'){ add((task.customType||'').trim()); return; }
    if(SUPPORT_TASKS.test(task.type)) return;
    const g = WORK_TYPE_GROUPS.find(([re])=>re.test(task.type));
    add(g ? g[1] : task.type);
  }));
  return types.join(' / ') || 'Tree Work';
}
function formatInspectionDate(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');
  return m ? `${m[2]}/${m[3]}/${m[1]}` : (d||'');
}
/* [SingleOps #] GTW - [Work Type] | [Client Name] - [CITY], [Inspection Date] */
function pdfTitle(){
  const c = state.client;
  const lead = String(c.leadNum||'').trim() || 'No SingleOps #';
  const place = [String(c.name||'').trim() || 'Client', String(c.city||'').trim().toUpperCase()].filter(Boolean).join(' - ');
  const date = formatInspectionDate(c.date);
  return `${lead} GTW - ${jobWorkTypes()} | ${place}${date ? ', '+date : ''}`;
}
/* Draws the title banner across the top of the first page, wrapping and shrinking the text to fit.
   Returns the banner height. Units follow the document (pt or in). */
function drawTitleBanner(doc, pageW, margin, maxSize, minSize, lineFactor, pad, title = pdfTitle()){
  doc.setFont('helvetica','bold');
  let size = maxSize, lines;
  for(;;){
    doc.setFontSize(size);
    lines = doc.splitTextToSize(title, pageW - margin*2);
    if(lines.length<=2 || size<=minSize) break;
    size -= 1;
  }
  const k = doc.internal.scaleFactor; // points per document unit
  const lh = size/k*lineFactor;
  const h = pad*2 + lh*lines.length;
  doc.setFillColor('#1A73E8'); doc.rect(0, 0, pageW, h, 'F');
  doc.setTextColor('#FFFFFF');
  lines.forEach((l,i)=>doc.text(l, margin, pad + lh*(i+0.78)));
  doc.setTextColor('#111111');
  doc.setProperties({ title });
  return h;
}

async function buildMainPdfDoc(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 44; let y = margin; const lineH = 15;

  function ensure(h){ if(y+h > pageH-margin){ doc.addPage(); y = margin; } }
  function h2(text){ ensure(24); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor('#1A73E8'); doc.text(text, margin, y); y+=18; doc.setTextColor('#111111'); }
  function p(text, size=10, bold=false, indent=0){
    doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(size);
    const lines = doc.splitTextToSize(String(text), pageW-margin*2-indent);
    lines.forEach(l=>{ ensure(lineH); doc.text(l, margin+indent, y); y+=lineH; });
  }
  const right = pageW - margin, priceX = right, hoursX = right - 86;
  /* One task line: "1a  Prune - Crown Raise ............ 3 hrs    $600.00", name wrapping before the columns. */
  function taskRow(label, name, hours, price, bold){
    doc.setFontSize(9.5);
    doc.setFont('helvetica', bold?'bold':'normal');
    const lines = doc.splitTextToSize(name, hoursX - 40 - (margin+38));
    ensure(lineH*lines.length);
    doc.setFont('helvetica','bold'); doc.text(label, margin+12, y);
    doc.setFont('helvetica', bold?'bold':'normal');
    lines.forEach((l,i)=>doc.text(l, margin+38, y + i*lineH));
    doc.setFont('helvetica','normal');
    doc.text(hours ? `${hours} hrs` : '-', hoursX, y, {align:'right'});
    doc.text(price!=='' && price!=null ? money(price) : '-', priceX, y, {align:'right'});
    y += lineH*lines.length;
  }
  function photoNote(text){ doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor('#64748B'); doc.text(text, right, y-lineH, {align:'right'}); doc.setTextColor('#111111'); }

  const bannerH = drawTitleBanner(doc, pageW, margin, 17, 11, 1.25, 14);
  y = bannerH + 28;

  /* One proposal-ready report: everything needed to build the SingleOps proposal, in the order it
     is entered there. No crew work order, running totals or GPS listing (those live on the notecard
     and in the GeoJSON/CSV). */
  h2('Client & Site Information');
  p('SingleOps #: '+(state.client.leadNum||'-'));
  p('Client: '+(state.client.name||'-'));
  p('City: '+(state.client.city||'').toUpperCase());
  p('Phone: '+(state.client.phone||'-')+'   Email: '+(state.client.email||'-'));
  p('Date: '+(state.client.date||'-')+'   Arborist/ Sales Rep: '+(state.client.arborist||'-'));
  y += 6;

  h2('Trees & Work Tasks');
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor('#64748B');
  doc.text('LABOR HRS', hoursX, y, {align:'right'}); doc.text('PRICE', priceX, y, {align:'right'});
  doc.setTextColor('#111111'); y += 12;
  state.trees.forEach((tree,ti)=>{
    ensure(lineH*3);
    doc.setDrawColor('#E2E8F0'); doc.line(margin, y-11, right, y-11);
    p(`Tree #${ti+1}: ${tree.species||'Unspecified species'}  (DBH: ${tree.dbh||'-'}")`, 11, true);
    if(photoSrc(tree.mainPhoto)) photoNote('Photo '+treeLabel(ti));
    if(tree.location) p('Location: '+tree.location, 9.5, false, 12);
    if(Number(tree.price)) taskRow('', 'Tree price', '', tree.price, false);
    tree.tasks.forEach((task,tj)=>{
      taskRow(`${ti+1}${taskLetter(tj)}`, taskTypeLabel(task) + (task.splitJob ? '  [SPLIT JOB]' : ''), task.hours, task.price, !!task.splitJob);
      if(task.details) p(task.details, 9, false, 38);
      if(photoSrc(task.photo)){ doc.setTextColor('#64748B'); p('Photo '+taskLabel(ti,tj), 8, false, 38); doc.setTextColor('#111111'); }
    });
    y += 8;
  });

  const eq = state.equipment;
  const eqPriced = [];
  if(eq.crane.needed && Number(eq.crane.price)) eqPriced.push(['Crane '+(eq.crane.spec||''), Number(eq.crane.price)]);
  if(eq.spyderLift.needed && Number(eq.spyderLift.price)) eqPriced.push(['Spyder Lift', Number(eq.spyderLift.price)]);
  if(eqPriced.length){
    h2('Additional Priced Equipment');
    eqPriced.forEach(([label,price])=>p(`${label}: ${money(price)}`, 9.5));
  }
  y += 6;

  h2('Required Equipment');
  const eqList = selectedEquipment();
  if(!eqList.length) p('None selected.');
  eqList.forEach(([n,d])=>p(d ? `${n}: ${d}` : n));
  p('Crew Details: '+(state.client.crewSize||'-'));
  y+=6;

  h2('Work Plan & Mobilization Logistics');
  p(state.workPlan || 'None noted.');
  y+=6;

  h2('Safety Concerns');
  p(state.safety || 'None noted.');
  y+=6;

  h2('Access & Permits');
  const apList = selectedAccessPermits();
  if(!apList.length) p('None selected.');
  apList.forEach(a=>p('• '+a));
  y+=6;

  h2('Crew / Internal Notes');
  p('Crew Notes: '+(state.notes.crew||'-'));
  p('Internal Notes: '+(state.notes.internal||'-'));
  p('Scheduling / Traffic Control: '+(state.notes.scheduling||'-'));
  p('Client Notes: '+(state.notes.client||'-'));
  y+=6;

  /* Tags: repeats the selections above as chips, ready to add as SingleOps tags. */
  h2('Tags');
  const tags = jobTags();
  if(!tags.length) p('None.');
  else{
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    const chipH = 18, padX = 7, gapX = 6, gapY = 6;
    let x = margin; y -= 4;
    ensure(chipH);
    tags.forEach(tag=>{
      const text = doc.splitTextToSize(tag, pageW - margin*2 - padX*2)[0];
      const w = doc.getTextWidth(text) + padX*2;
      if(x + w > pageW - margin){ x = margin; y += chipH + gapY; }
      if(y + chipH > pageH - margin){ doc.addPage(); y = margin; x = margin; }
      doc.setFillColor('#E8F0FE'); doc.setDrawColor('#AECBFA');
      doc.roundedRect(x, y, w, chipH, 4, 4, 'FD');
      doc.setTextColor('#0E5BC4'); doc.text(text, x + padX, y + 12.5);
      x += w + gapX;
    });
    doc.setTextColor('#111111'); y += chipH + 10;
  }

  drawPhotoPages(doc, pageW, pageH, margin);
  return doc;
}

/* Photo pages at the end of the report. Tree photos come first, with the site map, for building the
   SingleOps inventory map; task photos follow. Two per row, each labelled with its SingleOps ID. */
function drawPhotoPages(doc, pageW, pageH, margin){
  const treePhotos = [], taskPhotos = [];
  state.trees.forEach((tree,ti)=>{
    if(photoSrc(tree.mainPhoto)) treePhotos.push({ src: photoSrc(tree.mainPhoto), label: treeLabel(ti), sub: `Tree #${ti+1}: ${tree.species||'Unspecified species'}` });
    tree.tasks.forEach((task,tj)=>{
      if(photoSrc(task.photo)) taskPhotos.push({ src: photoSrc(task.photo), label: taskLabel(ti,tj), sub: `${ti+1}${taskLetter(tj)}: ${taskTypeLabel(task)}` });
    });
  });
  const hasMap = geoPoints().length > 0;
  if(!treePhotos.length && !taskPhotos.length && !hasMap) return;

  const gap = 16, colW = (pageW - margin*2 - gap)/2, boxH = colW*0.75;
  let y;
  function heading(text, note){
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor('#1A73E8'); doc.text(text, margin, y); y += 14;
    if(note){
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor('#475569');
      doc.splitTextToSize(note, pageW - margin*2).forEach(l=>{ doc.text(l, margin, y); y += 12; });
    }
    doc.setTextColor('#111111'); y += 8;
  }
  function grid(items){
    items.forEach((it,i)=>{
      const col = i % 2;
      if(col===0 && y + boxH + 30 > pageH - margin){ doc.addPage(); y = margin; }
      const x = margin + col*(colW+gap);
      try{
        const props = doc.getImageProperties(it.src);
        const k = Math.min(colW/props.width, boxH/props.height);
        const w = props.width*k, h = props.height*k;
        doc.setFillColor('#F1F5F9'); doc.rect(x, y, colW, boxH, 'F');
        doc.addImage(it.src, /^data:image\/png/i.test(it.src) ? 'PNG' : 'JPEG', x + (colW-w)/2, y + (boxH-h)/2, w, h);
      }catch(err){}
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text(it.label, x, y + boxH + 13);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor('#475569');
      doc.text(doc.splitTextToSize(it.sub, colW)[0], x, y + boxH + 24); doc.setTextColor('#111111');
      if(col===1 || i===items.length-1) y += boxH + 36;
    });
  }

  doc.addPage(); y = margin;
  if(treePhotos.length || hasMap){
    heading('Tree Photos & Site Map: for the SingleOps inventory map',
      'Use these to place and label each tree in the SingleOps inventory map. Photo labels match the SingleOps tree IDs.');
    if(hasMap){
      const mapW = pageW - margin*2, mapH = mapW*0.5;
      const mapCanvas = renderSiteMapCanvas(1200, 600);
      doc.setDrawColor('#CFE0FB'); doc.rect(margin, y, mapW, mapH);
      doc.addImage(mapCanvas.toDataURL('image/jpeg', 0.9), 'JPEG', margin, y, mapW, mapH);
      y += mapH + 12;
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor('#64748B');
      doc.text('Pin positions come from captured GPS and are relative to one another, not a surveyed map.', margin, y);
      doc.setTextColor('#111111'); y += 20;
    }
    grid(treePhotos);
  }
  if(taskPhotos.length){
    if(y + 40 + boxH > pageH - margin){ doc.addPage(); y = margin; }
    heading('Task Photos');
    grid(taskPhotos);
  }
}

/* Man-hours for the first visit: every task's hours except those split off to a later visit. */
function mainVisitHours(){
  let h = 0;
  state.trees.forEach(tree=>tree.tasks.forEach(task=>{ if(!task.splitJob) h += Number(task.hours)||0; }));
  return Math.round(h*100)/100;
}

/* The 5x7 crew card's sections. A section only appears when it has something to say, and nothing
   already in the title banner (SingleOps #, client, city, date) is repeated. */
function notecardSections(){
  const out = [];
  const add = (head, paras)=>{ paras = paras.map(t=>String(t||'').trim()).filter(Boolean); if(paras.length) out.push({ head, paras }); };
  const c = state.client;
  add(null, [[c.phone && 'Phone: '+c.phone, c.email && 'Email: '+c.email].filter(Boolean).join('    ')]);
  // Each split task is its own return visit, numbered on from the first visit: [SingleOps #]-2, -3...
  const splits = [], lead = String(c.leadNum||'').trim();
  state.trees.forEach((tree,ti)=>tree.tasks.forEach((task,tj)=>{
    if(!task.splitJob) return;
    const n = splits.length + 2;
    splits.push(`${lead ? lead+'-'+n : 'Visit '+n}: Tree #${ti+1} (${ti+1}${taskLetter(tj)}) ${taskTypeLabel(task)}  ${task.hours||'-'}h  ${money(task.price)}`);
  }));
  add('Split Visits', splits);
  add('Equipment', [selectedEquipment().map(([n,d])=>d ? `${n} ${d}` : n).join(', ')]);
  add('Crew Details', [c.crewSize]);
  add('Work Plan / Mobilization', [state.workPlan]);
  add('Access & Permits', [selectedAccessPermits().join(', ')]);
  add('Traffic Control / Scheduling', [state.notes.scheduling]);
  add('Safety Notes', [state.safety]);
  return out;
}

/* 5x7 landscape card. Sections flow down two columns, and the text size is the largest that fits
   the card (smallest size spills onto a second card if there is a lot to say). */
function buildNotecardDoc(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'in', format:[5,7], orientation:'landscape' });
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 0.3, gap = 0.3, colW = (pageW - margin*2 - gap)/2;
  const bannerH = drawTitleBanner(doc, pageW, margin, 14, 9, 1.2, 0.12, `${pdfTitle()} | ${mainVisitHours()} man-hrs`);
  const sections = notecardSections();
  const lh = size=>size/72*1.28;

  function layout(s, draw){
    const headSize = 10.5*s, bodySize = 9*s;
    let page = 1, col = 0, top = bannerH + 0.2, y = top;
    const bottom = pageH - margin;
    function nextColumn(){
      col++;
      if(col>1){ col = 0; page++; top = margin; if(draw) doc.addPage([5,7], 'landscape'); }
      y = top;
    }
    function text(str, size, bold, color){
      if(!draw) return;
      doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(size); doc.setTextColor(color);
      doc.text(str, margin + col*(colW+gap), y + size/72*0.9);
    }
    sections.forEach(sec=>{
      doc.setFont('helvetica','normal'); doc.setFontSize(bodySize);
      const body = [].concat(...sec.paras.map(p=>doc.splitTextToSize(p, colW)));
      // Keep a heading with its first line.
      const firstH = (sec.head ? lh(headSize) : 0) + lh(bodySize);
      if(y + firstH > bottom && y > top) nextColumn();
      if(sec.head){ text(sec.head, headSize, true, '#1A73E8'); y += lh(headSize); }
      body.forEach(l=>{
        if(y + lh(bodySize) > bottom) nextColumn();
        text(l, bodySize, false, '#111111'); y += lh(bodySize);
      });
      y += 0.09*s;
    });
    return page;
  }
  let s = 2;
  while(s > 0.7 && layout(s, false) > 1) s = Math.round((s - 0.05)*100)/100;
  layout(s, true);
  doc.setTextColor('#111111');
  return doc;
}

function buildGeoJSON(){
  return {
    type:'FeatureCollection',
    features: state.trees.map((tree,ti)=>({
      type:'Feature',
      geometry: (isFinite(parseFloat(tree.gps.lat)) && isFinite(parseFloat(tree.gps.lng)))
        ? { type:'Point', coordinates: [parseFloat(tree.gps.lng), parseFloat(tree.gps.lat)] } : null,
      properties: {
        treeNumber: ti+1, species: tree.species||'', dbh: tree.dbh||'', location: tree.location||'',
        price: tree.price||'', leadNum: state.client.leadNum||'', city: (state.client.city||'').toUpperCase(),
        accuracyMeters: tree.gps.accuracy||''
      }
    }))
  };
}
function buildCSV(){
  const header = ['TreeNumber','Latitude','Longitude','Accuracy_m','Species','DBH','Location','Price','LeadNum','City'];
  const rows = state.trees.map((tree,ti)=>[ti+1, tree.gps.lat||'', tree.gps.lng||'', tree.gps.accuracy||'', csvEsc(tree.species), tree.dbh||'', csvEsc(tree.location), tree.price||'', state.client.leadNum||'', (state.client.city||'').toUpperCase()]);
  return [header.join(','), ...rows.map(r=>r.join(','))].join('\n');
}

function localISODate(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function safeFilePart(s){ return String(s||'').trim().replace(/[^A-Za-z0-9.-]+/g,'_').replace(/^_+|_+$/g,''); }
/* ZIP bundle (and its top-level folder): [ClientName]_[Date]_GTW_export */
function zipExportName(){
  return `${safeFilePart(state.client.name)||'Client'}_${safeFilePart(state.client.date)||localISODate()}_GTW_export`;
}
function jobFileBase(){
  return `RTEC_GTW_${(state.client.city||'Job').replace(/[^a-z0-9]+/gi,'_')}_${state.client.date||''}`.replace(/_+$/,'');
}

async function withBusy(btn, label, fn){
  const orig = btn.textContent; btn.disabled = true; btn.textContent = label;
  try{ await fn(); } catch(err){ console.error(err); toast('Error: '+err.message); }
  finally{ btn.disabled = false; btn.textContent = orig; }
}

async function downloadMainPdfOnly(btn){
  await withBusy(btn, 'Generating…', async ()=>{
    const doc = await buildMainPdfDoc();
    doc.save(jobFileBase()+'_Report.pdf');
    toast('PDF report downloaded.');
  });
}
function downloadNotecardOnly(){
  const btn = document.getElementById('genCardBtn');
  withBusy(btn, 'Generating…', async ()=>{
    const doc = buildNotecardDoc();
    doc.save(jobFileBase()+'_Notecard.pdf');
    toast('Notecard PDF downloaded.');
  });
}
async function generateAndDownloadZip(btn){
  await withBusy(btn, 'Building ZIP…', async ()=>{
    const exportName = zipExportName();
    const zip = new JSZip();
    const root = zip.folder(exportName);
    const mainDoc = await buildMainPdfDoc();
    root.file(jobFileBase()+'_Report.pdf', mainDoc.output('blob'));
    const cardDoc = buildNotecardDoc();
    root.file(jobFileBase()+'_Notecard.pdf', cardDoc.output('blob'));
    root.file('tree_coordinates.geojson', JSON.stringify(buildGeoJSON(), null, 2));
    root.file('tree_coordinates.csv', buildCSV());
    const media = root.folder('media');
    state.trees.forEach((tree,ti)=>{
      const label = safeFilePart(treeLabel(ti));
      if(tree.mainPhoto){
        if(tree.mainPhoto.originalDataUrl) media.file(`${label}-original.jpg`, dataUrlToBlob(tree.mainPhoto.originalDataUrl));
        if(tree.mainPhoto.editedDataUrl) media.file(`${label}-edited.jpg`, dataUrlToBlob(tree.mainPhoto.editedDataUrl));
      }
      tree.tasks.forEach((task,tj)=>{
        const tl = safeFilePart(taskLabel(ti,tj));
        if(task.photo){
          if(task.photo.originalDataUrl) media.file(`${tl}-original.jpg`, dataUrlToBlob(task.photo.originalDataUrl));
          if(task.photo.editedDataUrl) media.file(`${tl}-edited.jpg`, dataUrlToBlob(task.photo.editedDataUrl));
        }
      });
    });
    const blob = await zip.generateAsync({ type:'blob' });
    downloadBlob(blob, exportName+'.zip');
    toast('ZIP bundle downloaded.');
  });
}

/* ===================== Init ===================== */
(async function init(){
  document.getElementById('speciesList').innerHTML = SPECIES_OPTIONS.map(s=>`<option value="${esc(s)}">`).join('');
  const saved = await loadState();
  if(saved) state = saved;
  render();
})();
</script>
