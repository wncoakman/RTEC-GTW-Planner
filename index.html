<!doctype html>
<html lang="en">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#1A73E8">

<link rel="apple-touch-icon" id="appleTouchIconLink">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { brand: { DEFAULT: '#1A73E8', dark: '#0E5BC4', light: '#E8F0FE' } } } }
  };

<style>
  html,body{ overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  body{ padding-bottom: env(safe-area-inset-bottom); }
  #editorCanvas{ touch-action:none; display:block; background:#111; }
  .tool-btn[aria-pressed="true"]{ background:#1A73E8; color:#fff; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ opacity:1; }
  ::-webkit-scrollbar{ width:8px; height:8px; }

<body class="bg-slate-50 text-slate-800 font-sans">

<header class="bg-brand text-white sticky top-0 z-30 shadow">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold leading-tight">RTEC GTW Job Builder</h1>
      <p class="text-xs text-brand-light opacity-90" id="jobSubtitle">New Job</p>
    </div>
    <button id="newJobBtn" class="text-xs bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-lg">New Job</button>
  </div>
  <nav class="max-w-3xl mx-auto px-4 pb-3 flex items-center gap-2 text-xs" id="stepperNav"></nav>
</header>

<main class="max-w-3xl mx-auto px-4 py-4 pb-28" id="appRoot"></main>

<div id="toastHost" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

<footer class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-30" id="footerNav">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <button id="backBtn" class="px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 font-medium disabled:opacity-40">Back</button>
    <div class="flex gap-1" id="stepDots"></div>
    <button id="nextBtn" class="px-4 py-2.5 rounded-lg bg-brand text-white font-semibold">Next</button>
  </div>
</footer>

<!-- ===================== Photo Doodle Editor Modal ===================== -->
<div id="editorModal" class="fixed inset-0 z-50 bg-black hidden flex flex-col">
  <div class="flex items-center justify-between px-3 py-2 bg-slate-900 text-white text-sm">
    <span class="font-semibold">Edit Photo</span>
    <div class="flex gap-2">
      <button id="edCancelBtn" class="px-3 py-1.5 rounded bg-slate-700">Cancel</button>
      <button id="edSaveBtn" class="px-3 py-1.5 rounded bg-brand font-semibold">Save</button>
    </div>
  </div>
  <div class="relative flex-1 overflow-hidden" id="edCanvasWrap">
    <canvas id="editorCanvas"></canvas>
  </div>
  <div class="bg-slate-900 text-white px-2 py-2 flex flex-col gap-2">
    <div class="flex gap-1.5 overflow-x-auto pb-1" id="edToolRow">
      <button data-tool="pan" class="tool-btn px-3 py-2 rounded bg-slate-700 text-xs font-medium whitespace-nowrap">✋ Pan/Zoom</button>
      <button data-tool="draw" class="tool-btn px-3 py-2 rounded bg-slate-700 text-xs font-medium whitespace-nowrap">✏️ Draw</button>
      <button data-tool="text" class="tool-btn px-3 py-2 rounded bg-slate-700 text-xs font-medium whitespace-nowrap">T Text</button>
      <button data-tool="circle" class="tool-btn px-3 py-2 rounded bg-slate-700 text-xs font-medium whitespace-nowrap">🔍 Magnify</button>
      <button data-tool="select" class="tool-btn px-3 py-2 rounded bg-slate-700 text-xs font-medium whitespace-nowrap">↖ Select</button>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <label class="flex items-center gap-1 text-xs text-slate-200"><input type="checkbox" id="edArrowMode"> Arrow mode</label>
      <div class="flex gap-1.5 ml-1" id="edSwatches"></div>
      <div class="flex-1"></div>
      <button id="edUndoBtn" class="px-2.5 py-1.5 rounded bg-slate-700 text-xs">Undo</button>
      <button id="edClearBtn" class="px-2.5 py-1.5 rounded bg-slate-700 text-xs">Clear</button>
      <button id="edDeleteBtn" class="px-2.5 py-1.5 rounded bg-red-700 text-xs disabled:opacity-30" disabled>Delete</button>
      <button id="edResetZoomBtn" class="px-2.5 py-1.5 rounded bg-slate-700 text-xs">Reset Zoom</button>
    </div>
  </div>
</div>

<script>
/* ===================== Runtime icon + manifest (fully self-contained) ===================== */
(function generateIcons(){
  function iconDataUrl(size){
    const c = document.createElement('canvas'); c.width=size; c.height=size;
    const ctx = c.getContext('2d');
    const r = size*0.19;
    ctx.fillStyle = '#1A73E8';
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.arcTo(size,0,size,size,r); ctx.arcTo(size,size,0,size,r); ctx.arcTo(0,size,0,0,r); ctx.arcTo(0,0,size,0,r);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold '+(size*0.32)+'px Arial, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('GTW', size/2, size*0.56);
    return c.toDataURL('image/png');
  }
  const icon192 = iconDataUrl(192), icon512 = iconDataUrl(512);
  document.getElementById('faviconLink').href = icon192;
  document.getElementById('appleTouchIconLink').href = icon192;
  const manifest = {
    name: 'RTEC GTW Job Builder', short_name: 'GTW Job Builder', start_url: '.', display: 'standalone',
    background_color: '#F8FAFC', theme_color: '#1A73E8',
    icons: [{src:icon192, sizes:'192x192', type:'image/png'},{src:icon512, sizes:'512x512', type:'image/png'}]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  document.getElementById('manifestLink').href = URL.createObjectURL(blob);
})();

/* Best-effort offline caching via a blob-registered service worker. Requires the page be served
   over https:// (or localhost) - service workers are not available under file://, and iOS Safari's
   support for blob-URL service workers can vary by version. The app works fully online regardless;
   this only adds offline-after-first-load on platforms/hosting that support it. */
(function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  const swSrc = `
    const CACHE='rtec-gtw-v1';
    const ASSETS=[self.registration.scope,'https://cdn.tailwindcss.com','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'];
    self.addEventListener('install', e=>{ e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).catch(()=>{})); self.skipWaiting(); });
    self.addEventListener('activate', e=>{ self.clients.claim(); });
    self.addEventListener('fetch', e=>{
      e.respondWith(caches.match(e.request).then(cached=>{
        const fetchPromise = fetch(e.request).then(res=>{ const copy=res.clone(); caches.open(CACHE).then(c=>c.put(e.request, copy)); return res; }).catch(()=>cached);
        return cached || fetchPromise;
      }));
    });
  `;
  try{
    const url = URL.createObjectURL(new Blob([swSrc], {type:'application/javascript'}));
    navigator.serviceWorker.register(url).catch(()=>{});
  }catch(e){}
})();

/* ===================== Constants ===================== */
const WORK_TASK_TYPES = [
  'Prune - Crown Clean','Prune - Crown Raise','Prune - Crown Reduce','Prune - Crown Thin',
  'Prune - Deadwood Removal','Prune - Structural / Young Tree Training','Prune - Vista / View',
  'Prune - Clearance (Structure/Utility)','Removal - Full Tree Removal','Removal - Partial / Hazard Limb',
  'Stump Grinding','Cabling / Bracing','Root Collar Excavation','PHC - Deep Root Fertilization',
  'PHC - Insect Treatment','PHC - Disease Treatment','PHC - Soil Injection / Amendment',
  'Planting - New Tree Installation','Mulching','Haul Wood','Chip Debris / Haul Chips','Other (specify)'
];
const ACCESS_ITEMS = [
  ['neighborPermission',"Neighbor's Written Permission"],
  ['dominion','Dominion'],
  ['pepco','Pepco'],
  ['parkingPermits','Parking Permits'],
  ['missUtility','Miss Utility'],
  ['ddotRemoval','DDOT Removal Permit']
];
const COLORS = ['#FF3B30','#FFCC00','#FFFFFF','#111111','#1A73E8','#34C759'];

/* ===================== State ===================== */
let uidCounter = 1;
function uid(){ return uidCounter++; }
function newTask(){ return { id: uid(), type: WORK_TASK_TYPES[0], customType:'', details:'', hours:'', price:'', splitJob:false, splitVisit:false, photo:null }; }
function newTree(){ return { id: uid(), mainPhoto:null, gps:{lat:'',lng:'',accuracy:''}, species:'', dbh:'', location:'', price:'', tasks:[newTask()], open:true }; }
function newState(){
  return {
    step: 0,
    client: { leadNum:'', city:'', name:'', phone:'', email:'', date:'', arborist:'', crewSize:'' },
    trees: [newTree()],
    equipment: {
      bucketTruck:'None', chipTruck:'None', extraChipTruck:'No',
      crane:{ needed:false, spec:'', price:'' },
      stumpGrinder:'None', miniLoader:'None',
      spyderLift:{ needed:false, spec:'', price:'' }
    },
    safety: '',
    accessPermits: { standard:{ neighborPermission:false,dominion:false,pepco:false,parkingPermits:false,missUtility:false,ddotRemoval:false }, custom:[] },
    notes: { crew:'', client:'', internal:'', scheduling:'' }
  };
}
let state = loadState() || newState();

function saveState(){ try{ localStorage.setItem('rtecGtwJob', JSON.stringify(state)); }catch(e){} }
function loadState(){ try{ const raw = localStorage.getItem('rtecGtwJob'); if(!raw) return null; const s = JSON.parse(raw); uidCounter = 1 + Math.max(0, ...collectIds(s)); return s; }catch(e){ return null; } }
function collectIds(s){
  const ids=[];
  (s.trees||[]).forEach(t=>{ ids.push(t.id||0); (t.tasks||[]).forEach(tk=>ids.push(tk.id||0)); });
  return ids;
}
let debounceTimer=null;
function persist(){ clearTimeout(debounceTimer); debounceTimer = setTimeout(saveState, 300); }

/* ===================== Utils ===================== */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setPath(obj, path, value){ const parts = path.split('.'); let cur=obj; for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; } cur[parts[parts.length-1]] = value; }
function getPath(obj, path){ return path.split('.').reduce((c,p)=> c==null?c:c[p], obj); }
function toast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataUrlToBlob(dataUrl){
  const [meta,b64] = dataUrl.split(',');
  const mime = (meta.match(/:(.*?);/)||[,'image/jpeg'])[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
}
function csvEsc(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function money(n){ return '$'+(Number(n)||0).toFixed(2); }

/* ===================== Step scaffolding ===================== */
const STEPS = ['Client & Site', 'Trees', 'Logistics', 'Generate'];
const appRoot = document.getElementById('appRoot');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');

function render(){
  document.getElementById('jobSubtitle').textContent = state.client.name
    ? `${state.client.name} — ${(state.client.city||'').toUpperCase()}` : 'New Job';
  renderStepper();
  if(state.step===0) renderStepClient();
  else if(state.step===1) renderStepTrees();
  else if(state.step===2) renderStepLogistics();
  else renderStepGenerate();
  backBtn.disabled = state.step===0;
  nextBtn.textContent = state.step===STEPS.length-1 ? 'Done' : 'Next';
  nextBtn.style.visibility = state.step===STEPS.length-1 ? 'hidden' : 'visible';
  persist();
}
function renderStepper(){
  const nav = document.getElementById('stepperNav');
  nav.innerHTML = STEPS.map((s,i)=>`
    <button data-step="${i}" class="px-2.5 py-1 rounded-full ${i===state.step?'bg-white text-brand font-semibold':'bg-white/10 text-white/80'}">${i+1}. ${esc(s)}</button>
  `).join('<span class="text-white/40">›</span>');
  const dots = document.getElementById('stepDots');
  dots.innerHTML = STEPS.map((_,i)=>`<span class="step-dot ${i===state.step?'active':''}"></span>`).join('');
}

/* ===================== Step 0: Client & Site Info (no header) ===================== */
function renderStepClient(){
  const c = state.client;
  appRoot.innerHTML = `
  <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <label class="col-span-2 text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">SingleOps Lead #</span>
        <input data-bind="client.leadNum" value="${esc(c.leadNum)}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <label class="col-span-2 text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">City</span>
        <input data-bind="client.city" value="${esc(c.city)}" class="w-full border border-slate-300 rounded-lg px-3 py-2 uppercase" placeholder="Auto-formatted in ALL CAPS on export"></label>
      <label class="col-span-2 text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Client Name</span>
        <input data-bind="client.name" value="${esc(c.name)}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <label class="text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Phone Number</span>
        <input data-bind="client.phone" value="${esc(c.phone)}" type="tel" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <label class="text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Email</span>
        <input data-bind="client.email" value="${esc(c.email)}" type="email" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <label class="text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Date</span>
        <input data-bind="client.date" value="${esc(c.date)}" type="date" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
      <label class="text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Arborist Name</span>
        <input data-bind="client.arborist" value="${esc(c.arborist)}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
    </div>
  </div>`;
}

/* ===================== Step 1: Tree-by-tree inventory ===================== */
function photoSlotHtml(photo, treeIdx, taskIdx, role){
  const hasPhoto = photo && (photo.editedDataUrl || photo.originalDataUrl);
  const src = hasPhoto ? (photo.editedDataUrl || photo.originalDataUrl) : '';
  return `
  <div class="space-y-1.5">
    ${hasPhoto ? `<img src="${src}" class="photo-thumb">` : `<div class="photo-thumb flex items-center justify-center text-slate-400 text-xs border border-dashed border-slate-300">No photo</div>`}
    <div class="flex gap-2">
      <label class="flex-1 text-center text-xs font-medium bg-slate-100 hover:bg-slate-200 rounded-lg py-2 cursor-pointer">
        ${hasPhoto ? 'Replace Photo' : 'Take / Upload Photo'}
        <input type="file" accept="image/*" capture="environment" class="hidden" data-photo-input data-tree-idx="${treeIdx}" ${taskIdx!=null?`data-task-idx="${taskIdx}"`:''} data-role="${role}">
      </label>
      <button class="flex-1 text-xs font-medium bg-brand-light text-brand-dark rounded-lg py-2 disabled:opacity-40" ${hasPhoto?'':'disabled'}
        data-photo-edit data-tree-idx="${treeIdx}" ${taskIdx!=null?`data-task-idx="${taskIdx}"`:''} data-role="${role}">Edit / Annotate</button>
    </div>
  </div>`;
}

function renderStepTrees(){
  const parts = state.trees.map((tree,ti)=>{
    const subtotal = (Number(tree.price)||0) + tree.tasks.reduce((s,t)=>s+(Number(t.price)||0),0);
    return `
    <div class="bg-white rounded-xl border border-slate-200 mb-3 overflow-hidden" data-tree-card="${ti}">
      <button class="w-full flex items-center justify-between px-4 py-3 bg-slate-50" data-tree-toggle="${ti}">
        <span class="font-semibold text-sm">Tree ${ti+1}${tree.species?': '+esc(tree.species):''}</span>
        <span class="flex items-center gap-2 text-xs text-slate-500">${money(subtotal)} <svg class="w-4 h-4 transition-transform ${tree.open?'rotate-180':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      ${tree.open ? `
      <div class="p-4 space-y-4">
        ${photoSlotHtml(tree.mainPhoto, ti, null, 'main')}

        <div>
          <span class="block text-xs font-medium text-slate-500 mb-1">GPS Location</span>
          <div class="grid grid-cols-3 gap-2">
            <input data-bind="trees.${ti}.gps.lat" value="${esc(tree.gps.lat)}" placeholder="Latitude" class="border border-slate-300 rounded-lg px-2 py-2 text-sm">
            <input data-bind="trees.${ti}.gps.lng" value="${esc(tree.gps.lng)}" placeholder="Longitude" class="border border-slate-300 rounded-lg px-2 py-2 text-sm">
            <input data-bind="trees.${ti}.gps.accuracy" value="${esc(tree.gps.accuracy)}" placeholder="± meters" class="border border-slate-300 rounded-lg px-2 py-2 text-sm">
          </div>
          <div class="flex gap-2 mt-2">
            <button class="flex-1 text-xs font-medium bg-brand text-white rounded-lg py-2" data-gps-capture="${ti}">📍 Capture GPS</button>
            ${(tree.gps.lat&&tree.gps.lng) ? `<a class="text-xs font-medium bg-slate-100 rounded-lg py-2 px-3 flex items-center" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(tree.gps.lat)},${encodeURIComponent(tree.gps.lng)}">View on Map</a>` : ''}
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <label class="col-span-2 text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Tree Type / Species</span>
            <input data-bind="trees.${ti}.species" value="${esc(tree.species)}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
          <label class="text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Size (DBH, in)</span>
            <input data-bind="trees.${ti}.dbh" value="${esc(tree.dbh)}" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
          <label class="text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Tree Price</span>
            <input data-bind="trees.${ti}.price" value="${esc(tree.price)}" type="number" step="0.01" class="w-full border border-slate-300 rounded-lg px-3 py-2"></label>
          <label class="col-span-2 text-sm"><span class="block text-xs font-medium text-slate-500 mb-1">Specific Location on Landscape</span>
            <input data-bind="trees.${ti}.location" value="${esc(tree.location)}" class="w-full border border-slate-300 rounded-lg px-3 py-2" placeholder="e.g. front yard, left of driveway"></label>
        </div>

        <div class="border-t border-slate-200 pt-3">
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-semibold">Work Tasks</span>
            <button class="text-xs font-medium bg-brand text-white rounded-lg px-3 py-1.5" data-add-task="${ti}">+ Add Task</button>
          </div>
          <div class="space-y-3">
            ${tree.tasks.map((task,tj)=>renderTaskCard(tree,ti,task,tj)).join('')}
          </div>
        </div>

        <button class="w-full text-xs font-medium text-red-600 bg-red-50 rounded-lg py-2" data-remove-tree="${ti}">Remove Tree ${ti+1}</button>
      </div>` : ''}
    </div>`;
  }).join('');

  appRoot.innerHTML = parts + `
    <button class="w-full bg-brand text-white font-semibold rounded-xl py-3 mt-2" id="addTreeBtn">+ Add Tree</button>
  `;
}

function renderTaskCard(tree, ti, task, tj){
  const label = String(ti+1) + String.fromCharCode(97+tj);
  return `
  <div class="bg-slate-50 rounded-lg p-3 space-y-2.5" data-task-card="${tj}">
    <div class="flex items-center justify-between">
      <span class="text-xs font-semibold text-slate-500">Task ${label}</span>
      <button class="text-xs text-red-600" data-remove-task="${ti}" data-remove-task-idx="${tj}">Remove</button>
    </div>
    <select data-bind="trees.${ti}.tasks.${tj}.type" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
      ${WORK_TASK_TYPES.map(opt=>`<option value="${esc(opt)}" ${task.type===opt?'selected':''}>${esc(opt)}</option>`).join('')}
    </select>
    ${task.type==='Other (specify)' ? `<input data-bind="trees.${ti}.tasks.${tj}.customType" value="${esc(task.customType)}" placeholder="Specify task" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">` : ''}
    <textarea data-bind="trees.${ti}.tasks.${tj}.details" rows="2" placeholder="Task details" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">${esc(task.details)}</textarea>

/* ===================== Event delegation ===================== */
appRoot.addEventListener('input', handleBind);
appRoot.addEventListener('change', handleBind);
function handleBind(e){
  const path = e.target.getAttribute('data-bind');
  if(!path) return;
  const val = e.target.type==='checkbox' ? e.target.checked : e.target.value;
  setPath(state, path, val);
  persist();
  if(e.target.type==='checkbox' && (path.startsWith('equipment.crane.needed')||path.startsWith('equipment.spyderLift.needed'))){
    renderStepLogistics();
  }
  if(path.includes('.type') && e.target.tagName==='SELECT'){
    renderStepTrees();
  }
}

document.getElementById('stepperNav').addEventListener('click', e=>{
  const btn = e.target.closest('[data-step]'); if(!btn) return;
  state.step = Number(btn.dataset.step); render();
});
backBtn.addEventListener('click', ()=>{ if(state.step>0){ state.step--; render(); } });
nextBtn.addEventListener('click', ()=>{ if(state.step<STEPS.length-1){ state.step++; render(); } });
document.getElementById('newJobBtn').addEventListener('click', ()=>{
  if(confirm('Start a new job? This clears all current data.')){ state = newState(); uidCounter=1; saveState(); render(); }
});

appRoot.addEventListener('click', async e=>{
  const toggle = e.target.closest('[data-tree-toggle]');
  if(toggle){ const i=Number(toggle.dataset.treeToggle); state.trees[i].open = !state.trees[i].open; renderStepTrees(); return; }

  if(e.target.id==='addTreeBtn'){ state.trees.push(newTree()); renderStepTrees(); persist(); return; }

  const rmTree = e.target.closest('[data-remove-tree]');
  if(rmTree){ if(confirm('Remove this tree and all its tasks?')){ state.trees.splice(Number(rmTree.dataset.removeTree),1); renderStepTrees(); persist(); } return; }

  const addTask = e.target.closest('[data-add-task]');
  if(addTask){ state.trees[Number(addTask.dataset.addTask)].tasks.push(newTask()); renderStepTrees(); persist(); return; }

  const rmTask = e.target.closest('[data-remove-task]');
  if(rmTask){ const ti=Number(rmTask.dataset.removeTask), tj=Number(rmTask.dataset.removeTaskIdx); state.trees[ti].tasks.splice(tj,1); renderStepTrees(); persist(); return; }

  const gps = e.target.closest('[data-gps-capture]');
  if(gps){
    const ti = Number(gps.dataset.gpsCapture);
    if(!navigator.geolocation){ toast('Geolocation not available - enter manually.'); return; }
    gps.textContent = 'Capturing...';
    navigator.geolocation.getCurrentPosition(pos=>{
      state.trees[ti].gps = { lat:pos.coords.latitude.toFixed(6), lng:pos.coords.longitude.toFixed(6), accuracy:Math.round(pos.coords.accuracy) };
      renderStepTrees(); persist(); toast('GPS captured.');
    }, err=>{ toast('GPS failed: '+err.message+' - enter manually.'); renderStepTrees(); }, {enableHighAccuracy:true, timeout:10000});
    return;
  }

  const photoEdit = e.target.closest('[data-photo-edit]');
  if(photoEdit){ openEditorFromEl(photoEdit); return; }

  if(e.target.id==='addCustomAccessBtn'){ state.accessPermits.custom.push({label:'', checked:false}); renderStepLogistics(); persist(); return; }
  const rmCustom = e.target.closest('[data-remove-custom-access]');
  if(rmCustom){ state.accessPermits.custom.splice(Number(rmCustom.dataset.removeCustomAccess),1); renderStepLogistics(); persist(); return; }

  if(e.target.id==='genZipBtn'){ await generateAndDownloadZip(e.target); return; }
  if(e.target.id==='genPdfBtn'){ await downloadMainPdfOnly(e.target); return; }
  if(e.target.id==='genCardBtn'){ downloadNotecardOnly(); return; }
});

/* ===================== Photo Doodle Editor ===================== */
const edModal = document.getElementById('editorModal');
const edCanvas = document.getElementById('editorCanvas');
const edCtx = edCanvas.getContext('2d');
let ed = null; // current editor session
let edTarget = null; // {treeIdx, taskIdx|null, role}

function findPhoto(target){
  const tree = state.trees[target.treeIdx];
  return target.role==='main' ? tree.mainPhoto : tree.tasks[target.taskIdx].photo;
}

function openEditorFromEl(el){
  edTarget = { treeIdx: Number(el.dataset.treeIdx), taskIdx: el.dataset.taskIdx!=null ? Number(el.dataset.taskIdx) : null, role: el.dataset.role };
  const photo = findPhoto(edTarget);
  if(!photo || !photo.originalDataUrl){ toast('No photo to edit yet.'); return; }
  const img = new Image();
  img.onload = ()=>{
    edModal.classList.remove('hidden');
    sizeEditorCanvas();
    ed = {
      img, scale:1, baseScale: Math.min(edCanvas.width/img.width, edCanvas.height/img.height),
      panX:0, panY:0, tool:'pan', color: COLORS[0], arrowMode:false,
      shapes: JSON.parse(JSON.stringify(photo.shapes||[])),
      selectedId: null, activePointers: new Map(), drawShape:null, pinch:null, dragMove:null
    };
    buildSwatches();
    setActiveTool('pan');
    redrawEditor();
  };
  img.src = photo.originalDataUrl;
}
function sizeEditorCanvas(){
  const wrap = document.getElementById('edCanvasWrap');
  const dpr = window.devicePixelRatio || 1;
  edCanvas.width = Math.round(wrap.clientWidth*dpr);
  edCanvas.height = Math.round(wrap.clientHeight*dpr);
  edCanvas.style.width = wrap.clientWidth+'px';
  edCanvas.style.height = wrap.clientHeight+'px';
}
function buildSwatches(){
  const row = document.getElementById('edSwatches');
  row.innerHTML = COLORS.map(c=>`<button class="swatch" data-color="${c}" style="background:${c}" aria-pressed="${ed.color===c}"></button>`).join('');
}
document.getElementById('edSwatches').addEventListener('click', e=>{
  const sw = e.target.closest('[data-color]'); if(!sw||!ed) return;
  ed.color = sw.dataset.color;
  buildSwatches();
});
document.getElementById('edArrowMode').addEventListener('change', e=>{ if(ed) ed.arrowMode = e.target.checked; });

document.getElementById('edToolRow').addEventListener('click', e=>{
  const btn = e.target.closest('[data-tool]'); if(!btn) return;
  setActiveTool(btn.dataset.tool);
});
function setActiveTool(tool){
  if(ed) ed.tool = tool;
  document.querySelectorAll('#edToolRow [data-tool]').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.tool===tool)));
}

function eff(){ return ed.baseScale*ed.scale; }
function canvasPointFromEvent(evt){
  const rect = edCanvas.getBoundingClientRect();
  return { cx: (evt.clientX-rect.left)*(edCanvas.width/rect.width), cy: (evt.clientY-rect.top)*(edCanvas.height/rect.height) };
}
function toImageSpace(cx,cy){
  const e = eff();
  return { x: (cx - edCanvas.width/2 - ed.panX)/e + ed.img.width/2, y: (cy - edCanvas.height/2 - ed.panY)/e + ed.img.height/2 };
}

function redrawEditor(){
  edCtx.setTransform(1,0,0,1,0,0);
  edCtx.clearRect(0,0,edCanvas.width,edCanvas.height);
  edCtx.fillStyle = '#111'; edCtx.fillRect(0,0,edCanvas.width,edCanvas.height);
  const e = eff();
  edCtx.save();
  edCtx.translate(edCanvas.width/2+ed.panX, edCanvas.height/2+ed.panY);
  edCtx.scale(e,e);
  edCtx.drawImage(ed.img, -ed.img.width/2, -ed.img.height/2);
  ed.shapes.forEach(s=>drawShape(s, s.id===ed.selectedId));
  if(ed.drawShape) drawShape(ed.drawShape, false);
  edCtx.restore();
  document.getElementById('edDeleteBtn').disabled = ed.selectedId==null;
}
function drawShape(s, selected){
  edCtx.save();
  if(s.type==='freehand'){
    edCtx.strokeStyle = s.color; edCtx.lineWidth = s.width; edCtx.lineJoin='round'; edCtx.lineCap='round';
    edCtx.beginPath();
    (s.points||[]).forEach((p,i)=> i===0?edCtx.moveTo(p.x,p.y):edCtx.lineTo(p.x,p.y));
    edCtx.stroke();
  } else if(s.type==='arrow'){
    edCtx.strokeStyle = s.color; edCtx.fillStyle = s.color; edCtx.lineWidth = s.width; edCtx.lineCap='round';
    edCtx.beginPath(); edCtx.moveTo(s.x1,s.y1); edCtx.lineTo(s.x2,s.y2); edCtx.stroke();
    const ang = Math.atan2(s.y2-s.y1, s.x2-s.x1); const head = s.width*4+10;
    edCtx.beginPath();
    edCtx.moveTo(s.x2, s.y2);
    edCtx.lineTo(s.x2 - head*Math.cos(ang-Math.PI/7), s.y2 - head*Math.sin(ang-Math.PI/7));
    edCtx.lineTo(s.x2 - head*Math.cos(ang+Math.PI/7), s.y2 - head*Math.sin(ang+Math.PI/7));
    edCtx.closePath(); edCtx.fill();
  } else if(s.type==='text'){
    edCtx.fillStyle = s.color; edCtx.font = 'bold '+s.fontSize+'px Arial, sans-serif'; edCtx.textBaseline='top';
    edCtx.fillText(s.text, s.x, s.y);
  } else if(s.type==='circle'){
    edCtx.save();
    edCtx.beginPath(); edCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); edCtx.clip();
    edCtx.translate(s.x, s.y); edCtx.scale(s.mag, s.mag); edCtx.translate(-s.x, -s.y);
    edCtx.drawImage(ed.img, -ed.img.width/2, -ed.img.height/2);
    edCtx.restore();
    edCtx.strokeStyle = s.color; edCtx.lineWidth = Math.max(2, s.r*0.03);
    edCtx.beginPath(); edCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); edCtx.stroke();
  }
  if(selected){
    edCtx.strokeStyle = '#1A73E8'; edCtx.setLineDash([6/eff(),4/eff()]); edCtx.lineWidth = 2/eff();
    const b = shapeBounds(s);
    edCtx.strokeRect(b.x-6/eff(), b.y-6/eff(), b.w+12/eff(), b.h+12/eff());
    edCtx.setLineDash([]);
  }
  edCtx.restore();
}
function shapeBounds(s){
  if(s.type==='text'){ return { x:s.x, y:s.y, w: s.text.length*s.fontSize*0.55, h: s.fontSize }; }
  if(s.type==='circle'){ return { x:s.x-s.r, y:s.y-s.r, w:s.r*2, h:s.r*2 }; }
  if(s.type==='arrow'){ return { x:Math.min(s.x1,s.x2), y:Math.min(s.y1,s.y2), w:Math.abs(s.x2-s.x1)||1, h:Math.abs(s.y2-s.y1)||1 }; }
  const xs = s.points.map(p=>p.x), ys = s.points.map(p=>p.y);
  return { x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs)||1, h:Math.max(...ys)-Math.min(...ys)||1 };
}
function hitTest(ix,iy){
  const tol = 14/eff();
  for(let i=ed.shapes.length-1;i>=0;i--){
    const s = ed.shapes[i];
    if(s.type==='text'){ const b=shapeBounds(s); if(ix>=b.x-tol&&ix<=b.x+b.w+tol&&iy>=b.y-tol&&iy<=b.y+b.h+tol) return s; }
    else if(s.type==='circle'){ if(Math.hypot(ix-s.x, iy-s.y) <= s.r+tol) return s; }
    else if(s.type==='arrow'){ if(distToSeg(ix,iy,s.x1,s.y1,s.x2,s.y2) <= tol+s.width) return s; }
    else if(s.type==='freehand'){ for(let j=0;j<s.points.length-1;j++){ if(distToSeg(ix,iy,s.points[j].x,s.points[j].y,s.points[j+1].x,s.points[j+1].y) <= tol+s.width) return s; } }
  }
  return null;
}
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1; const len2 = dx*dx+dy*dy;
  let t = len2 ? ((px-x1)*dx+(py-y1)*dy)/len2 : 0; t = Math.max(0,Math.min(1,t));
  const cx=x1+t*dx, cy=y1+t*dy; return Math.hypot(px-cx,py-cy);
}
function moveShapeBy(s, dx, dy){
  if(s.type==='text'||s.type==='circle'){ s.x+=dx; s.y+=dy; }
  else if(s.type==='arrow'){ s.x1+=dx; s.y1+=dy; s.x2+=dx; s.y2+=dy; }
  else if(s.type==='freehand'){ s.points.forEach(p=>{ p.x+=dx; p.y+=dy; }); }
}

function pointersArr(){ return Array.from(ed.activePointers.values()); }
edCanvas.addEventListener('pointerdown', e=>{
  if(!ed) return;
  edCanvas.setPointerCapture(e.pointerId);
  const {cx,cy} = canvasPointFromEvent(e);
  ed.activePointers.set(e.pointerId, {cx,cy});
  if(ed.activePointers.size===2){
    const [a,b] = pointersArr();
    ed.pinch = { startDist: Math.hypot(a.cx-b.cx,a.cy-b.cy), startScale: ed.scale,
      mid0: {cx:(a.cx+b.cx)/2, cy:(a.cy+b.cy)/2}, imgMid0: toImageSpace((a.cx+b.cx)/2,(a.cy+b.cy)/2) };
    ed.dragMove = null; ed.drawShape = null;
    return;
  }
  const img = toImageSpace(cx,cy);
  if(ed.tool==='pan'){ ed.dragMove = { mode:'pan', startCx:cx, startCy:cy, startPanX:ed.panX, startPanY:ed.panY }; }
  else if(ed.tool==='select'){
    const hit = hitTest(img.x, img.y);
    ed.selectedId = hit ? hit.id : null;
    if(hit){ ed.dragMove = { mode:'moveShape', shape:hit, lastImg:img }; }
    redrawEditor();
  }
  else if(ed.tool==='draw'){
    const id = 'sh'+Date.now()+Math.random();
    if(ed.arrowMode){ ed.drawShape = { id, type:'arrow', x1:img.x, y1:img.y, x2:img.x, y2:img.y, color:ed.color, width: Math.max(3, ed.img.width*0.004) }; }
    else { ed.drawShape = { id, type:'freehand', points:[{x:img.x,y:img.y}], color:ed.color, width: Math.max(3, ed.img.width*0.004) }; }
  }
  else if(ed.tool==='text'){ ed.dragMove = { mode:'tap', startCx:cx, startCy:cy }; }
  else if(ed.tool==='circle'){ ed.dragMove = { mode:'tap', startCx:cx, startCy:cy }; }
});
edCanvas.addEventListener('pointermove', e=>{
  if(!ed || !ed.activePointers.has(e.pointerId)) return;
  const {cx,cy} = canvasPointFromEvent(e);
  ed.activePointers.set(e.pointerId, {cx,cy});
  if(ed.activePointers.size===2 && ed.pinch){
    const [a,b] = pointersArr();
    const dist = Math.hypot(a.cx-b.cx,a.cy-b.cy);
    const newScale = Math.max(0.3, Math.min(6, ed.pinch.startScale * (dist/ed.pinch.startDist)));
    const mid = {cx:(a.cx+b.cx)/2, cy:(a.cy+b.cy)/2};
    const e2 = ed.baseScale*newScale;
    ed.panX = mid.cx - edCanvas.width/2 - (ed.pinch.imgMid0.x - ed.img.width/2)*e2;
    ed.panY = mid.cy - edCanvas.height/2 - (ed.pinch.imgMid0.y - ed.img.height/2)*e2;
    ed.scale = newScale;
    redrawEditor();
    return;
  }
  if(ed.activePointers.size!==1 || !ed.dragMove) return;
  if(ed.dragMove.mode==='pan'){
    ed.panX = ed.dragMove.startPanX + (cx-ed.dragMove.startCx);
    ed.panY = ed.dragMove.startPanY + (cy-ed.dragMove.startCy);
    redrawEditor();
  } else if(ed.dragMove.mode==='moveShape'){
    const img = toImageSpace(cx,cy);
    moveShapeBy(ed.dragMove.shape, img.x-ed.dragMove.lastImg.x, img.y-ed.dragMove.lastImg.y);
    ed.dragMove.lastImg = img;
    redrawEditor();
  } else if(ed.dragMove.mode==='tap'){
    if(Math.hypot(cx-ed.dragMove.startCx, cy-ed.dragMove.startCy) > 8) ed.dragMove.moved = true;
  }
  if(ed.drawShape){
    const img = toImageSpace(cx,cy);
    if(ed.drawShape.type==='freehand') ed.drawShape.points.push({x:img.x,y:img.y});
    else { ed.drawShape.x2 = img.x; ed.drawShape.y2 = img.y; }
    redrawEditor();
  }
});
function endPointer(e){
  if(!ed) return;
  const had = ed.activePointers.has(e.pointerId);
  ed.activePointers.delete(e.pointerId);
  if(!had) return;
  if(ed.activePointers.size<2) ed.pinch = null;
  if(ed.activePointers.size===0){
    if(ed.drawShape){ ed.shapes.push(ed.drawShape); ed.selectedId = ed.drawShape.id; ed.drawShape=null; }
    if(ed.dragMove && ed.dragMove.mode==='tap' && !ed.dragMove.moved){
      const img = toImageSpace(ed.dragMove.startCx, ed.dragMove.startCy);
      if(ed.tool==='text'){
        const txt = prompt('Enter text:');
        if(txt){ ed.shapes.push({ id:'sh'+Date.now(), type:'text', x:img.x, y:img.y, text:txt, color:ed.color, fontSize: Math.max(18, ed.img.width*0.035) }); ed.selectedId = ed.shapes[ed.shapes.length-1].id; }
      } else if(ed.tool==='circle'){
        ed.shapes.push({ id:'sh'+Date.now(), type:'circle', x:img.x, y:img.y, r: ed.img.width*0.06, mag:2.5, color:ed.color });
        ed.selectedId = ed.shapes[ed.shapes.length-1].id;
      }
    }
    ed.dragMove = null;
    redrawEditor();
  }
}
edCanvas.addEventListener('pointerup', endPointer);
edCanvas.addEventListener('pointercancel', endPointer);
edCanvas.addEventListener('wheel', e=>{
  if(!ed) return;
  e.preventDefault();
  const {cx,cy} = canvasPointFromEvent(e);
  const img = toImageSpace(cx,cy);
  const factor = e.deltaY<0 ? 1.12 : 0.89;
  const newScale = Math.max(0.3, Math.min(6, ed.scale*factor));
  const e2 = ed.baseScale*newScale;
  ed.panX = cx - edCanvas.width/2 - (img.x-ed.img.width/2)*e2;
  ed.panY = cy - edCanvas.height/2 - (img.y-ed.img.height/2)*e2;
  ed.scale = newScale;
  redrawEditor();
}, {passive:false});

document.getElementById('edUndoBtn').addEventListener('click', ()=>{ if(ed && ed.shapes.length){ ed.shapes.pop(); ed.selectedId=null; redrawEditor(); } });
document.getElementById('edClearBtn').addEventListener('click', ()=>{ if(ed && ed.shapes.length && confirm('Clear all annotations on this photo?')){ ed.shapes=[]; ed.selectedId=null; redrawEditor(); } });
document.getElementById('edDeleteBtn').addEventListener('click', ()=>{
  if(!ed || ed.selectedId==null) return;
  ed.shapes = ed.shapes.filter(s=>s.id!==ed.selectedId); ed.selectedId=null; redrawEditor();
});
document.getElementById('edResetZoomBtn').addEventListener('click', ()=>{ if(ed){ ed.scale=1; ed.panX=0; ed.panY=0; redrawEditor(); } });
document.getElementById('edCancelBtn').addEventListener('click', closeEditor);
document.getElementById('edSaveBtn').addEventListener('click', ()=>{
  if(!ed) return;
  ed.selectedId = null; redrawEditor();
  const flattened = edCanvas.toDataURL('image/jpeg', 0.85);
  const photo = findPhoto(edTarget);
  photo.editedDataUrl = flattened;
  photo.shapes = JSON.parse(JSON.stringify(ed.shapes));
  closeEditor();
  renderStepTrees();
  persist();
});
function closeEditor(){ edModal.classList.add('hidden'); ed=null; edTarget=null; }
window.addEventListener('resize', ()=>{ if(ed){ sizeEditorCanvas(); ed.baseScale = Math.min(edCanvas.width/ed.img.width, edCanvas.height/ed.img.height); redrawEditor(); } });

/* ===================== PDF generation ===================== */
function taskTypeLabel(task){ return task.type==='Other (specify)' ? (task.customType||'Other') : task.type; }

async function buildMainPdfDoc(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
  const margin = 44; let y = margin; const lineH = 15;

  function ensure(h){ if(y+h > pageH-margin){ doc.addPage(); y = margin; } }
  function band(text, bg){
    doc.setFillColor(bg); doc.rect(0, y-20, pageW, 34, 'F');
    doc.setTextColor('#FFFFFF'); doc.setFont('helvetica','bold'); doc.setFontSize(14);
    doc.text(text, margin, y); y += 26; doc.setTextColor('#111111');
  }
  function h2(text){ ensure(24); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor('#1A73E8'); doc.text(text, margin, y); y+=18; doc.setTextColor('#111111'); }
  function p(text, size=10, bold=false, indent=0){
    doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(size);
    const lines = doc.splitTextToSize(String(text), pageW-margin*2-indent);
    lines.forEach(l=>{ ensure(lineH); doc.text(l, margin+indent, y); y+=lineH; });
  }
  function addPhoto(dataUrl, label, w){
    try{
      const props = doc.getImageProperties(dataUrl);
      const h = w*props.height/props.width;
      ensure(h+16);
      doc.addImage(dataUrl, 'JPEG', margin+indentCur, y, w, h);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor('#64748B');
      doc.text('Photo '+label, margin+indentCur, y+h+10); doc.setTextColor('#111111');
      y += h+20;
    }catch(err){}
  }
  let indentCur = 0;

  doc.setFillColor('#1A73E8'); doc.rect(0,0,pageW,54,'F');
  doc.setTextColor('#FFFFFF'); doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text('RTEC GTW Job Builder', margin, 34);
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text(new Date().toLocaleDateString(), pageW-margin-80, 34);
  y = 80;

  /* ===== PART 1: CLIENT PROPOSAL SCOPE ===== */
  band('CLIENT PROPOSAL SCOPE', '#1A73E8');
  h2('Client & Site Information');
  p('SingleOps Lead #: '+(state.client.leadNum||'-'));
  p('Client: '+(state.client.name||'-'));
  p('City: '+(state.client.city||'').toUpperCase());
  p('Phone: '+(state.client.phone||'-')+'   Email: '+(state.client.email||'-'));
  p('Date: '+(state.client.date||'-')+'   Arborist: '+(state.client.arborist||'-'));
  y += 6;

  let running = 0;
  h2('Tree-by-Tree Scope');
  state.trees.forEach((tree,ti)=>{
    const label = String(ti+1);
    ensure(20);
    p(`Tree ${label}: ${tree.species||'Unspecified species'}  (DBH: ${tree.dbh||'-'}")`, 11, true);
    indentCur = 10;
    p('Location: '+(tree.location||'-'), 9.5, false, 10);
    if(tree.gps.lat||tree.gps.lng) p(`GPS: ${tree.gps.lat}, ${tree.gps.lng} (±${tree.gps.accuracy||'?'}m)`, 9.5, false, 10);
    if(Number(tree.price)){ running += Number(tree.price); p(`Tree Price: ${money(tree.price)}   Running Total: ${money(running)}`, 9.5, true, 10); }
    if(tree.mainPhoto && (tree.mainPhoto.editedDataUrl||tree.mainPhoto.originalDataUrl)){ indentCur=10; addPhoto(tree.mainPhoto.editedDataUrl||tree.mainPhoto.originalDataUrl, label, 200); }
    tree.tasks.forEach((task,tj)=>{
      const tlabel = label+String.fromCharCode(97+tj);
      const tag = task.splitJob||task.splitVisit ? `  [${[task.splitJob&&'SPLIT JOB', task.splitVisit&&'SPLIT VISIT'].filter(Boolean).join(' / ')}]` : '';
      p(`• ${taskTypeLabel(task)}${tag}`, 9.5, !!(task.splitJob||task.splitVisit), 10);
      if(task.details) p(task.details, 9, false, 16);
      if(Number(task.price)){ running += Number(task.price); p(`Task Price: ${money(task.price)}   Running Total: ${money(running)}`, 9, true, 16); }
      if(task.photo && (task.photo.editedDataUrl||task.photo.originalDataUrl)){ indentCur=16; addPhoto(task.photo.editedDataUrl||task.photo.originalDataUrl, tlabel, 160); }
    });
    indentCur = 0; y += 4;
  });

  const eq = state.equipment;
  const eqPriced = [];
  if(eq.crane.needed && Number(eq.crane.price)) eqPriced.push(['Crane '+(eq.crane.spec||''), Number(eq.crane.price)]);
  if(eq.spyderLift.needed && Number(eq.spyderLift.price)) eqPriced.push(['Spyder Lift '+(eq.spyderLift.spec||''), Number(eq.spyderLift.price)]);
  if(eqPriced.length){
    h2('Additional Priced Equipment');
    eqPriced.forEach(([label,price])=>{ running+=price; p(`${label}: ${money(price)}   Running Total: ${money(running)}`, 9.5); });
  }

  ensure(30);
  doc.setDrawColor('#1A73E8'); doc.line(margin, y, pageW-margin, y); y+=18;
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor('#1A73E8');
  doc.text('GRAND TOTAL: '+money(running), margin, y); doc.setTextColor('#111111'); y+=24;

  /* ===== PART 2: CREW WORK ORDER ===== */
  doc.addPage(); y = margin;
  band('CREW WORK ORDER', '#334155');
  h2('Tree & Task Detail (hours, no pricing)');
  state.trees.forEach((tree,ti)=>{
    const label = String(ti+1);
    ensure(16);
    p(`Tree ${label}: ${tree.species||'Unspecified'} - ${tree.location||'-'}`, 10.5, true);
    tree.tasks.forEach((task,tj)=>{
      const tlabel = label+String.fromCharCode(97+tj);
      const tag = task.splitJob||task.splitVisit ? `  [${[task.splitJob&&'SPLIT JOB', task.splitVisit&&'SPLIT VISIT'].filter(Boolean).join(' / ')}]` : '';
      p(`• (${tlabel}) ${taskTypeLabel(task)} — Est. ${task.hours||'-'} hrs${tag}`, 9.5, false, 10);
    });
  });
  y += 6;
  h2('Required Equipment');
  if(eq.bucketTruck!=='None') p('Bucket Truck: '+eq.bucketTruck);
  if(eq.chipTruck!=='None') p('Chip Truck: '+eq.chipTruck);
  if(eq.extraChipTruck!=='No') p('Extra Chip Truck: '+eq.extraChipTruck);
  if(eq.crane.needed) p('Crane: '+(eq.crane.spec||'Yes'));
  if(eq.stumpGrinder!=='None') p('Stump Grinder: '+eq.stumpGrinder);
  if(eq.miniLoader!=='None') p('Mini Loader: '+eq.miniLoader);
  if(eq.spyderLift.needed) p('Spyder Lift: '+(eq.spyderLift.spec||'Yes'));
  p('Crew Size: '+(state.client.crewSize||'-'));
  y+=6;

  h2('Safety Concerns');
  p(state.safety || 'None noted.');
  y+=6;

  h2('Access & Permits');
  ACCESS_ITEMS.forEach(([k,label])=>{ p(`[${state.accessPermits.standard[k]?'X':' '}] ${label}`); });
  state.accessPermits.custom.forEach(c=>{ if(c.label) p(`[${c.checked?'X':' '}] ${c.label}`); });
  y+=6;

  h2('Crew / Internal Notes');
  p('Crew Notes: '+(state.notes.crew||'-'));
  p('Internal Notes: '+(state.notes.internal||'-'));
  p('Scheduling / Traffic Control: '+(state.notes.scheduling||'-'));
  p('Client Notes: '+(state.notes.client||'-'));

  return doc;
}

function buildNotecardDoc(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'in', format:[5,7] });
  const margin=0.3, pageW=5; let y=0.35;
  function line(text, size=9, bold=false){
    doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(size);
    const split = doc.splitTextToSize(String(text), pageW-margin*2);
    split.forEach(l=>{ if(y>6.7){ return; } doc.text(l, margin, y); y += size/72*1.35; });
  }
  doc.setFillColor('#1A73E8'); doc.rect(0,0,pageW,0.46,'F');
  doc.setTextColor('#FFFFFF'); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('RTEC GTW — Work Order', margin, 0.3);
  doc.setTextColor('#111111'); y = 0.64;

  line('Lead #: '+(state.client.leadNum||'-'), 10, true);
  line('Client: '+(state.client.name||'-'));
  line('City: '+(state.client.city||'').toUpperCase());
  line('Phone: '+(state.client.phone||'-')+'   Email: '+(state.client.email||'-'));
  y += 0.04;

  line('Split Work Tasks:', 10, true);
  let any=false;
  state.trees.forEach((tree,ti)=>{
    tree.tasks.forEach(task=>{
      if(task.splitJob||task.splitVisit){
        any=true;
        const tag = task.splitVisit?'SPLIT VISIT':'SPLIT JOB';
        line(`• T${ti+1}: ${taskTypeLabel(task)} [${tag}] ${task.hours||'-'}h ${money(task.price)}`, 8);
      }
    });
  });
  if(!any) line('None', 9);
  y += 0.04;

  line('Equipment:', 10, true);
  const eq = state.equipment; const eqLines=[];
  if(eq.bucketTruck!=='None') eqLines.push('Bucket Truck '+eq.bucketTruck);
  if(eq.chipTruck!=='None') eqLines.push('Chip Truck '+eq.chipTruck);
  if(eq.extraChipTruck!=='No') eqLines.push('Extra Chip Truck '+eq.extraChipTruck);
  if(eq.crane.needed) eqLines.push('Crane '+(eq.crane.spec||''));
  if(eq.stumpGrinder!=='None') eqLines.push('Stump Grinder '+eq.stumpGrinder);
  if(eq.miniLoader!=='None') eqLines.push('Mini Loader '+eq.miniLoader);
  if(eq.spyderLift.needed) eqLines.push('Spyder Lift '+(eq.spyderLift.spec||''));
  line(eqLines.join(', ')||'None', 8);
  y += 0.04;

  line('Crew Size: '+(state.client.crewSize||'-'), 9);
  y += 0.04;

  line('Access & Permits:', 10, true);
  const sel = ACCESS_ITEMS.filter(([k])=>state.accessPermits.standard[k]).map(([,l])=>l);
  state.accessPermits.custom.filter(c=>c.checked && c.label).forEach(c=>sel.push(c.label));
  line(sel.join(', ')||'None', 8);
  y += 0.04;

  line('Traffic Control / Scheduling:', 10, true);
  line(state.notes.scheduling||'-', 8);
  y += 0.04;

  line('Safety Notes:', 10, true);
  line(state.safety||'-', 8);

  return doc;
}

function buildGeoJSON(){
  return {
    type:'FeatureCollection',
    features: state.trees.map((tree,ti)=>({
      type:'Feature',
      geometry: { type:'Point', coordinates: [Number(tree.gps.lng)||0, Number(tree.gps.lat)||0] },
      properties: {
        treeNumber: ti+1, species: tree.species||'', dbh: tree.dbh||'', location: tree.location||'',
        price: tree.price||'', leadNum: state.client.leadNum||'', city: (state.client.city||'').toUpperCase(),
        accuracyMeters: tree.gps.accuracy||''
      }
    }))
  };
}
function buildCSV(){
  const header = ['TreeNumber','Latitude','Longitude','Accuracy_m','Species','DBH','Location','Price','LeadNum','City'];
  const rows = state.trees.map((tree,ti)=>[ti+1, tree.gps.lat||'', tree.gps.lng||'', tree.gps.accuracy||'', csvEsc(tree.species), tree.dbh||'', csvEsc(tree.location), tree.price||'', state.client.leadNum||'', (state.client.city||'').toUpperCase()]);
  return [header.join(','), ...rows.map(r=>r.join(','))].join('\n');
}

function jobFileBase(){
  return `RTEC_GTW_${(state.client.city||'Job').replace(/[^a-z0-9]+/gi,'_')}_${state.client.date||''}`.replace(/_+$/,'');
}

async function withBusy(btn, label, fn){
  const orig = btn.textContent; btn.disabled = true; btn.textContent = label;
  try{ await fn(); } catch(err){ console.error(err); toast('Error: '+err.message); }
  finally{ btn.disabled = false; btn.textContent = orig; }
}

async function downloadMainPdfOnly(btn){
  await withBusy(btn, 'Generating…', async ()=>{
    const doc = await buildMainPdfDoc();
    doc.save(jobFileBase()+'_Report.pdf');
    toast('PDF report downloaded.');
  });
}
function downloadNotecardOnly(){
  const btn = document.getElementById('genCardBtn');
  withBusy(btn, 'Generating…', async ()=>{
    const doc = buildNotecardDoc();
    doc.save(jobFileBase()+'_Notecard.pdf');
    toast('Notecard PDF downloaded.');
  });
}
async function generateAndDownloadZip(btn){
  await withBusy(btn, 'Building ZIP…', async ()=>{
    const zip = new JSZip();
    const mainDoc = await buildMainPdfDoc();
    zip.file(jobFileBase()+'_Report.pdf', mainDoc.output('blob'));
    const cardDoc = buildNotecardDoc();
    zip.file(jobFileBase()+'_Notecard.pdf', cardDoc.output('blob'));
    zip.file('tree_coordinates.geojson', JSON.stringify(buildGeoJSON(), null, 2));
    zip.file('tree_coordinates.csv', buildCSV());
    const media = zip.folder('media');
    state.trees.forEach((tree,ti)=>{
      const label = String(ti+1);
      if(tree.mainPhoto){
        if(tree.mainPhoto.originalDataUrl) media.file(`${label}-main-original.jpg`, dataUrlToBlob(tree.mainPhoto.originalDataUrl));
        if(tree.mainPhoto.editedDataUrl) media.file(`${label}-main-edited.jpg`, dataUrlToBlob(tree.mainPhoto.editedDataUrl));
      }
      tree.tasks.forEach((task,tj)=>{
        const tl = label+String.fromCharCode(97+tj);
        if(task.photo){
          if(task.photo.originalDataUrl) media.file(`${tl}-original.jpg`, dataUrlToBlob(task.photo.originalDataUrl));
          if(task.photo.editedDataUrl) media.file(`${tl}-edited.jpg`, dataUrlToBlob(task.photo.editedDataUrl));
        }
      });
    });
    const blob = await zip.generateAsync({ type:'blob' });
    downloadBlob(blob, jobFileBase()+'.zip');
    toast('ZIP bundle downloaded.');
  });
}

/* ===================== Init ===================== */
render();
