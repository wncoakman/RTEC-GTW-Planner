<style>
  html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
  body { background: #F3F6FB; color: #0B1220; padding-bottom: env(safe-area-inset-bottom); }

  .tap { min-height: 52px; }
  input, select, textarea {
    font-size: 16px; /* prevents iOS auto-zoom on focus */
  }
  input[type="range"] { -webkit-appearance: none; height: 6px; border-radius: 4px; background: #AECBFA; }
  input[type="range"]::-webkit-slider-thumb {

  .field-input {
    width: 100%; border-radius: 0.75rem; border: 2px solid #CFE0FB; background: white;

  html.dark .field-input { background: #15294A; border-color: #28406B; color: #EAF1FB; }
  .field-input:focus { outline: none; border-color: #1A73E8; box-shadow: 0 0 0 3px rgba(26,115,232,.25); }
  .btn-primary {
    background: #1A73E8; color: white; font-weight: 700; border-radius: 1rem;
    padding: 1rem 1.25rem; box-shadow: 0 2px 8px rgba(11,18,32,.25);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: .45; }
  .btn-secondary {
    background: transparent; color: #1A73E8; font-weight: 700; border-radius: 1rem;
    padding: 1rem 1.25rem; border: 2px solid #1A73E8;
  }
  html.dark .btn-secondary { color: #8AB4F8; border-color: #8AB4F8; }
  .btn-danger { background: #fdecec; color: #9b1c1c; font-weight: 700; border-radius: 0.75rem; padding: .6rem .9rem; }
  html.dark .btn-danger { background: #3a1616; color: #ff9b9b; }
  .card { background: white; border-radius: 1.1rem; box-shadow: 0 1px 6px rgba(11,18,32,.12); }
  html.dark .card { background: #122A46; box-shadow: none; border: 1px solid #1A73E8; }
  .chip {
    display: inline-flex; align-items: center; gap: .4rem; padding: .55rem .9rem; border-radius: 999px;
    border: 2px solid #CFE0FB; font-weight: 600; font-size: .85rem; cursor: pointer; user-select: none;
  }
  .chip.active { background: #1A73E8; color: white; border-color: #1A73E8; }
  html.dark .chip { border-color: #28406B; }
  html.dark .chip.active { background: #669DF6; color: #0B1220; border-color: #669DF6; }
  .split-box { background: #FFF7E6; border: 2px dashed #D97706; border-radius: .75rem; padding: .75rem; }
  html.dark .split-box { background: #2a2010; border-color: #D97706; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; bottom: calc(1rem + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: #0B1220; color: #EAF1FB; padding: .7rem 1.1rem; border-radius: .8rem; font-size: .9rem;
    z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,.35); opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #AECBFA; border-radius: 3px; }
</style>

<datalist id="speciesList"></datalist>

<script>
/* =========================== Constants =========================== */
const STORAGE_KEY = 'arborist_inspection_v1';
const DB_NAME = 'arborist-field-inspection';
const DB_STORE = 'drafts';

const SPECIES_OPTIONS = [
  'Red Oak','White Oak','Bur Oak','Pin Oak','Sugar Maple','Red Maple','Silver Maple',
  'Norway Maple','Japanese Maple','River Birch','American Elm','Honeylocust',
  'Littleleaf Linden','Flowering Pear (Callery)','Flowering Dogwood','Eastern Redbud',
  'Colorado Blue Spruce','Norway Spruce','White Pine','Austrian Pine','Arborvitae',
  'Crabapple','Magnolia','Tulip Poplar','Black Walnut','Hackberry','American Sycamore',
  'Green Ash','White Ash','Shagbark Hickory','Weeping Willow','Eastern Red Cedar',
  'Boxwood (shrub)','Burning Bush (shrub)','Serviceberry','Sweetgum','Kousa Dogwood'
];

const TASK_TYPES = [
  'Structural Pruning','Crown Cleaning','Crown Thinning','Crown Raising','Crown Reduction',
  'Deadwooding / Deadwood Removal','Cabling & Bracing','Root Collar Excavation','Root Pruning',
  'Cavity / Decay Treatment','PHC – Soil Injection','PHC – Foliar Spray','PHC – Deep Root Fertilization',
  'Insect / Disease Treatment','Tree Removal','Stump Grinding','Mulching','Lightning Protection System',
  'Risk Mitigation – Target Reduction','Other'
];

const EQUIPMENT_FIELDS = [
  { key: 'bucketTruck', label: "Bucket Truck", options: ['Not Needed', "60'", "75'"] },
  { key: 'chipTruck', label: 'Chip Truck', options: ['Not Needed', 'Small', 'Standard'] },
  { key: 'extraChipTruck', label: 'Extra Chip Truck', options: ['Not Needed', 'Small', 'Standard'] },
  { key: 'crane', label: 'Crane', options: ['Not Needed', 'Needed'], priceKey: 'cranePrice' },
  { key: 'stumpGrinder', label: 'Stump Grinder', options: ['Not Needed', 'Rayco', 'Timber'] },
  { key: 'miniLoader', label: 'Mini Loader', options: ['Not Needed', 'ML1', 'ML2'] },
  { key: 'spyderLift', label: 'Spyder Lift', options: ['Not Needed', 'Needed'], priceKey: 'spyderLiftPrice' }
];

const PERMITS_CHECKLIST = ["Neighbor's Written Permission", 'Dominion', 'Pepco', 'Parking Permits', 'Miss Utility', 'DDOT Removal Permit'];

/* =========================== Persistence (IndexedDB) =========================== */
let dbPromise = null;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE, { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
function dbPut(value) {
  return openDb().then(db => new Promise((resolve, reject) => {
    const req = db.transaction([DB_STORE], 'readwrite').objectStore(DB_STORE).put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function dbGet(id) {
  return openDb().then(db => new Promise((resolve, reject) => {
    const req = db.transaction([DB_STORE], 'readonly').objectStore(DB_STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function dbDelete(id) {
  return openDb().then(db => new Promise((resolve, reject) => {
    const req = db.transaction([DB_STORE], 'readwrite').objectStore(DB_STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  }));
}

let persistTimer = null;
function schedulePersist() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    dbPut({ id: 'current', state }).then(() => flashToast('Saved ✓')).catch(() => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    });
  }, 400);
}

/* =========================== State =========================== */
function todayISO() { return new Date().toISOString().slice(0, 10); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function defaultGps() { return { lat: '', lng: '', accuracy: null, capturedAt: null }; }
function defaultEquipment() {
  const eq = { equipmentOther: '' };
  EQUIPMENT_FIELDS.forEach(f => {
    eq[f.key] = 'Not Needed';
    if (f.priceKey) eq[f.priceKey] = '';
  });
  return eq;
}

function defaultState() {
  return {
    step: 1,
    client: {
      singleOpsLead: '', clientName: '', propertyAddress: '', contactName: '',
      contactPhone: '', contactEmail: '', inspectionDate: todayISO(), arboristName: ''
    },
    trees: [],
    workPlan: {
      crewSize: '', equipment: defaultEquipment(), trafficControl: '',
      permitsChecklist: [], permitsCustom: '', safetyConcerns: '',
      crewNotes: '', clientNotes: '', internalNotes: '', schedulingConcerns: ''
    }
  };
}

let state = defaultState();

function setByPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const key = /^\d+$/.test(parts[i]) ? Number(parts[i]) : parts[i];
    cur = cur[key];
  }
  const lastKey = /^\d+$/.test(parts[parts.length - 1]) ? Number(parts[parts.length - 1]) : parts[parts.length - 1];
  cur[lastKey] = value;
}
function getByPath(obj, path) {
  return path.split('.').reduce((cur, k) => (cur == null ? cur : cur[/^\d+$/.test(k) ? Number(k) : k]), obj);
}

/* =========================== Small UI helpers =========================== */
function flashToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

function confirmDialog(title, body) {
  return new Promise(resolve => {
    const modal = document.getElementById('confirmModal');
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmBody').textContent = body;
    modal.classList.remove('hidden');
    const ok = document.getElementById('confirmOk');
    const cancel = document.getElementById('confirmCancel');
    function cleanup(result) {
      modal.classList.add('hidden');
      ok.removeEventListener('click', onOk);
      cancel.removeEventListener('click', onCancel);
      resolve(result);
    }
    function onOk() { cleanup(true); }
    function onCancel() { cleanup(false); }
    ok.addEventListener('click', onOk);
    cancel.addEventListener('click', onCancel);
  });
}

function slugify(s) {
  return (s || '').toString().trim().replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'Unnamed';
}
function esc(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function money(v) {
  const n = parseFloat(v) || 0;
  return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function photoLabel(treeIdx, taskIdx) {
  return taskIdx == null ? String(treeIdx + 1) : `${treeIdx + 1}${String.fromCharCode(97 + taskIdx)}`;
}

/* =========================== Step nav / routing =========================== */
const STEP_LABELS = ['Client & Site', 'Trees', 'Work Plan', 'Review & Export'];

function renderStepNav() {
  const nav = document.getElementById('stepNav');
  nav.innerHTML = STEP_LABELS.map((label, i) => {
    const n = i + 1;
    const active = state.step === n;
    return `<button data-goto-step="${n}" class="tap py-2 ${active ? 'bg-brand-800 text-white' : 'text-brand-100'}">${n}. ${label}</button>`;
  }).join('');
}

function goToStep(n) {
  state.step = n;
  schedulePersist();
  renderAll();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function renderAll() {
  renderStepNav();
  const app = document.getElementById('app');
  if (state.step === 1) app.innerHTML = renderStep1();
  else if (state.step === 2) app.innerHTML = renderStep2();
  else if (state.step === 3) app.innerHTML = renderStep3();
  else app.innerHTML = renderStep4();
  updateTotals();
  const siteMapHolder = document.getElementById('siteMapHolder');
  if (siteMapHolder) {
    const canvas = renderSiteMapCanvas(560, 380);
    canvas.style.maxWidth = '100%';
    siteMapHolder.appendChild(canvas);
  }
}

/* =========================== Step 1: Client & Site =========================== */
function renderStep1() {
  const field = (label, path, placeholder = '', type = 'text') => `
    <div>
      <label class="field-label">${label}</label>
      <input class="field-input mt-1" type="${type}" data-bind="client.${path}" value="${esc(getByPath(state, 'client.' + path))}" placeholder="${esc(placeholder)}">
    </div>`;
  return `
    <div class="space-y-4">
      <div class="card p-4">
        <div class="grid grid-cols-1 gap-3">
          ${field('SingleOps Lead #', 'singleOpsLead', 'e.g. 10234')}
          ${field('Client Name', 'clientName', 'Jane Smith')}
          ${field('Job Site Address', 'propertyAddress', '123 Maple St, Washington DC')}
          ${field('Contact Name', 'contactName', 'If different from client')}
          <div class="grid grid-cols-2 gap-3">
            ${field('Contact Phone', 'contactPhone', '(555) 555-5555', 'tel')}
            ${field('Contact Email', 'contactEmail', 'name@email.com', 'email')}
          </div>
          ${field('Inspection Date', 'inspectionDate', '', 'date')}
          ${field('Arborist Name', 'arboristName', 'Your name')}
        </div>
      </div>
      <button class="btn-primary w-full tap" data-next-from-1>Next: Tree Inventory →</button>
    </div>`;
}

/* =========================== Step 2: Tree Inventory =========================== */
function addTree() {
  state.trees.forEach(t => t.expanded = false);
  state.trees.push({
    id: uid(), species: '', dbh: '', location: '', price: '',
    gps: defaultGps(), mainPhoto: null, tasks: [], expanded: true
  });
  schedulePersist();
  renderAll();
  setTimeout(() => {
    const el = document.querySelector(`[data-tree-anchor="${state.trees[state.trees.length - 1].id}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 30);
}

function toggleTree(id) {
  const t = state.trees.find(x => x.id === id);
  t.expanded = !t.expanded;
  renderAll();
}

async function removeTree(id) {
  const ok = await confirmDialog('Delete this tree?', 'This removes its photos and work items. This cannot be undone.');
  if (!ok) return;
  state.trees = state.trees.filter(x => x.id !== id);
  schedulePersist();
  renderAll();
}

function addTask(treeId) {
  const t = state.trees.find(x => x.id === treeId);
  t.tasks.push({ id: uid(), type: TASK_TYPES[0], customType: '', details: '', hours: '', price: '', isSplit: false, splitHours: '', splitPrice: '', photo: null });
  schedulePersist();
  renderAll();
}
function removeTask(treeId, taskId) {
  const t = state.trees.find(x => x.id === treeId);
  t.tasks = t.tasks.filter(x => x.id !== taskId);
  schedulePersist();
  renderAll();
}
function toggleSplit(treeId, taskId) {
  const t = state.trees.find(x => x.id === treeId);
  const task = t.tasks.find(x => x.id === taskId);
  task.isSplit = !task.isSplit;
  schedulePersist();
  renderAll();
}

function captureGps(treeId) {
  const t = state.trees.find(x => x.id === treeId);
  if (!navigator.geolocation) { flashToast('Geolocation not supported on this device'); return; }
  flashToast('Getting GPS fix…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      t.gps.lat = pos.coords.latitude.toFixed(6);
      t.gps.lng = pos.coords.longitude.toFixed(6);
      t.gps.accuracy = pos.coords.accuracy;
      t.gps.capturedAt = new Date().toISOString();
      schedulePersist();
      renderAll();
      flashToast(pos.coords.accuracy > 25 ? 'GPS captured — weak signal, verify position' : 'GPS captured ✓');
    },
    err => {
      let msg = 'GPS unavailable — enter coordinates manually';
      if (err.code === 1) msg = 'Location permission denied — enable in Settings or enter manually';
      else if (err.code === 3) msg = 'GPS timed out (heavy canopy?) — enter manually';
      flashToast(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

/* ---- Photo slot targeting: "main:<treeId>" or "task:<treeId>:<taskId>" ---- */
function parsePhotoTarget(str) {
  const [kind, treeId, taskId] = str.split(':');
  return { kind, treeId, taskId };
}
function getPhotoSlot(target) {
  const t = state.trees.find(x => x.id === target.treeId);
  if (target.kind === 'main') return { get: () => t.mainPhoto, set: p => { t.mainPhoto = p; } };
  const task = t.tasks.find(x => x.id === target.taskId);
  return { get: () => task.photo, set: p => { task.photo = p; } };
}

async function removePhoto(targetStr) {
  const ok = await confirmDialog('Remove this photo?', 'This cannot be undone.');
  if (!ok) return;
  getPhotoSlot(parsePhotoTarget(targetStr)).set(null);
  schedulePersist();
  renderAll();
}

function renderPhotoBlock(label, photo, targetStr) {
  if (!photo) {
    return `
      <div class="flex gap-2">
        <button class="chip" data-take-photo="${targetStr}">📷 Take Photo</button>
        <button class="chip" data-choose-photo="${targetStr}">🖼 Choose</button>
      </div>`;
  }
  return `
    <div class="flex items-center gap-3">
      <img src="${photo.hasMarkup ? photo.markupDataUrl : photo.originalDataUrl}" class="w-20 h-20 object-cover rounded-xl border-2 border-brand-200">
      <div class="flex flex-col gap-1">
        <button class="text-xs btn-secondary py-1 px-2 rounded-lg" data-remark-photo="${targetStr}">✎ Edit Markup</button>
        <button class="text-xs btn-danger py-1 px-2" data-remove-photo="${targetStr}">✕ Remove</button>
      </div>
      <div class="text-xs opacity-60 ml-auto">Photo ${esc(label)}</div>
    </div>`;
}

function taskTotals(task) {
  const hrs = (parseFloat(task.hours) || 0) + (task.isSplit ? (parseFloat(task.splitHours) || 0) : 0);
  const price = (parseFloat(task.price) || 0) + (task.isSplit ? (parseFloat(task.splitPrice) || 0) : 0);
  return { hrs, price };
}
function treeTotals(t) {
  return t.tasks.reduce((acc, task) => {
    const tt = taskTotals(task);
    acc.hrs += tt.hrs; acc.price += tt.price;
    return acc;
  }, { hrs: 0, price: (parseFloat(t.price) || 0) });
}

function renderTreeCard(t, idx) {
  const totals = treeTotals(t);
  if (!t.expanded) {
    return `
      <div class="card p-4 flex items-center justify-between" data-tree-anchor="${t.id}">

/* =========================== Photo capture + downscale =========================== */
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function downscale(img, maxDim = 1800, quality = 0.85) {
  let { width, height } = img;
  if (width > maxDim || height > maxDim) {
    if (width >= height) { height = Math.round(height * maxDim / width); width = maxDim; }
    else { width = Math.round(width * maxDim / height); height = maxDim; }
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return { dataUrl: canvas.toDataURL('image/jpeg', quality), width, height };
}

let pendingPhotoTarget = null;
function handlePhotoFile(targetStr, file) {
  if (!file) return;
  loadImageFromFile(file).then(img => {
    const { dataUrl, width, height } = downscale(img);
    const photo = { id: uid(), originalDataUrl: dataUrl, markupDataUrl: null, hasMarkup: false, width, height };
    getPhotoSlot(parsePhotoTarget(targetStr)).set(photo);
    schedulePersist();
    renderAll();
    openMarkupModal(targetStr);
  }).catch(() => flashToast('Could not read photo'));
}

/* =========================== Markup canvas tool =========================== */
const markup = {
  target: null, baseImage: null, hadBaseMarkup: false,
  strokes: [], current: null, tool: 'pen', color: '#ff2d2d', width: 6,
  zoom: { scale: 1, tx: 0, ty: 0 }, activePointers: new Map(), pinchStart: null, drawing: false
};

function applyZoomTransform() {
  const wrap = document.getElementById('markupZoomWrap');
  wrap.style.transform = `translate(${markup.zoom.tx}px, ${markup.zoom.ty}px) scale(${markup.zoom.scale})`;
}

function openMarkupModal(targetStr) {
  const target = parsePhotoTarget(targetStr);
  const p = getPhotoSlot(target).get();
  markup.target = targetStr; markup.strokes = []; markup.current = null;
  markup.hadBaseMarkup = p.hasMarkup;
  markup.zoom = { scale: 1, tx: 0, ty: 0 };
  markup.activePointers.clear(); markup.pinchStart = null; markup.drawing = false;
  applyZoomTransform();

  const img = new Image();
  img.onload = () => {
    markup.baseImage = img;
    const canvas = document.getElementById('markupCanvas');
    canvas.width = p.width; canvas.height = p.height;
    redrawMarkup();
    document.getElementById('markupModal').classList.remove('hidden');
  };
  img.src = p.hasMarkup ? p.markupDataUrl : p.originalDataUrl;

  renderMarkupToolbar();
}

function renderMarkupToolbar() {
  const tools = [['pen', '✏️ Pen'], ['arrow', '➡️ Arrow'], ['circle', '⭕ Circle'], ['magnify', '🔎 Magnify'], ['text', '🔤 Text']];
  document.getElementById('markupTools').innerHTML = tools.map(([val, label]) =>
    `<button type="button" class="chip ${markup.tool === val ? 'active' : ''}" data-markup-tool="${val}" style="color:white;border-color:white">${label}</button>`
  ).join('');
  const colors = ['#ff2d2d', '#ffd60a', '#00e0ff', '#ffffff'];
  document.getElementById('markupColors').innerHTML = colors.map(c =>
    `<button type="button" data-markup-color="${c}" style="background:${c};width:36px;height:36px;border-radius:50%;border:3px solid ${markup.color === c ? '#1A73E8' : 'rgba(255,255,255,.5)'}"></button>`
  ).join('');
  document.getElementById('markupWidth').value = markup.width;
}

function canvasPoint(evt) {
  const canvas = document.getElementById('markupCanvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return [(evt.clientX - rect.left) * scaleX, (evt.clientY - rect.top) * scaleY];
}

function drawStroke(ctx, s) {
  ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.width;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (s.tool === 'pen') {
    ctx.beginPath();
    s.points.forEach((pt, i) => i === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
    ctx.stroke();
  } else if (s.tool === 'arrow') {
    const [x1, y1, x2, y2] = [s.x1, s.y1, s.x2, s.y2];
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headLen = Math.max(14, s.width * 4);
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 7), y2 - headLen * Math.sin(angle - Math.PI / 7));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 7), y2 - headLen * Math.sin(angle + Math.PI / 7));
    ctx.closePath(); ctx.fill();
  } else if (s.tool === 'circle') {
    const cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
    const rx = Math.abs(s.x2 - s.x1) / 2, ry = Math.abs(s.y2 - s.y1) / 2;
    ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(rx, 1), Math.max(ry, 1), 0, 0, Math.PI * 2); ctx.stroke();
  } else if (s.tool === 'magnify') {
    const cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
    const r = Math.max(Math.hypot(s.x2 - s.x1, s.y2 - s.y1) / 2, 14);
    const zoomFactor = 2.5;
    const srcR = r / zoomFactor;
    if (markup.baseImage) {
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(markup.baseImage, cx - srcR, cy - srcR, srcR * 2, srcR * 2, cx - r, cy - r, r * 2, r * 2);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(s.width, 3); ctx.stroke();
  } else if (s.tool === 'text') {
    ctx.font = `bold ${Math.max(18, s.width * 4)}px sans-serif`;
    ctx.textBaseline = 'top';
    ctx.fillText(s.text, s.x, s.y);
  }
}

function redrawMarkup() {
  const canvas = document.getElementById('markupCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (markup.baseImage) ctx.drawImage(markup.baseImage, 0, 0, canvas.width, canvas.height);
  markup.strokes.forEach(s => drawStroke(ctx, s));
  if (markup.current) drawStroke(ctx, markup.current);
}

function wireMarkupCanvas() {
  const canvas = document.getElementById('markupCanvas');

  canvas.addEventListener('pointerdown', e => {
    markup.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (markup.activePointers.size === 2) {
      markup.drawing = false; markup.current = null; redrawMarkup();
      const pts = [...markup.activePointers.values()];
      const wrap = document.getElementById('markupZoomWrap');
      const viewport = document.getElementById('markupViewport');
      const viewportRect = viewport.getBoundingClientRect();
      const postRect = wrap.getBoundingClientRect();
      const staticLeft = postRect.left - viewportRect.left - markup.zoom.tx;
      const staticTop = postRect.top - viewportRect.top - markup.zoom.ty;
      const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      markup.pinchStart = {
        dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
        scale: markup.zoom.scale, viewportRect, staticLeft, staticTop,
        ax: (mid.x - viewportRect.left - staticLeft - markup.zoom.tx) / markup.zoom.scale,
        ay: (mid.y - viewportRect.top - staticTop - markup.zoom.ty) / markup.zoom.scale
      };
      return;
    }
    if (markup.activePointers.size > 2 || markup.pinchStart) return;

    const [x, y] = canvasPoint(e);
    if (markup.tool === 'text') {
      const txt = prompt('Enter label text:');
      if (txt) {
        markup.strokes.push({ tool: 'text', color: markup.color, width: markup.width, x, y, text: txt });
        redrawMarkup();
      }
      return;
    }
    markup.drawing = true;
    if (markup.tool === 'pen') markup.current = { tool: 'pen', color: markup.color, width: markup.width, points: [[x, y]] };
    else markup.current = { tool: markup.tool, color: markup.color, width: markup.width, x1: x, y1: y, x2: x, y2: y };
    redrawMarkup();
  });

  canvas.addEventListener('pointermove', e => {
    if (markup.activePointers.has(e.pointerId)) markup.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (markup.activePointers.size === 2 && markup.pinchStart) {
      const pts = [...markup.activePointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
      const ps = markup.pinchStart;
      const newScale = Math.min(4, Math.max(1, ps.scale * (dist / ps.dist)));
      markup.zoom.scale = newScale;
      markup.zoom.tx = mid.x - ps.viewportRect.left - ps.staticLeft - newScale * ps.ax;
      markup.zoom.ty = mid.y - ps.viewportRect.top - ps.staticTop - newScale * ps.ay;
      applyZoomTransform();
      return;
    }
    if (!markup.drawing || !markup.current) return;
    const [x, y] = canvasPoint(e);
    if (markup.tool === 'pen') markup.current.points.push([x, y]);
    else { markup.current.x2 = x; markup.current.y2 = y; }
    redrawMarkup();
  });

  function finish(e) {
    markup.activePointers.delete(e.pointerId);
    if (markup.activePointers.size < 2) markup.pinchStart = null;
    if (markup.drawing && markup.current) { markup.strokes.push(markup.current); markup.current = null; }
    markup.drawing = false;
    redrawMarkup();
  }
  canvas.addEventListener('pointerup', finish);
  canvas.addEventListener('pointercancel', finish);
}

/* =========================== Geo / Site Map =========================== */
function geoPoints() {
  return state.trees
    .map((t, i) => ({ i, t, lat: parseFloat(t.gps.lat), lng: parseFloat(t.gps.lng) }))
    .filter(p => isFinite(p.lat) && isFinite(p.lng));
}
function toLocalXY(lat, lng, originLat, originLng) {
  const R = 6371000;
  const dLat = (lat - originLat) * Math.PI / 180;
  const dLng = (lng - originLng) * Math.PI / 180;
  return { x: dLng * Math.cos(originLat * Math.PI / 180) * R, y: dLat * R };
}
function niceRoundScale(v) {
  if (v <= 0) return 5;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / pow;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * pow;
}
function renderSiteMapCanvas(width = 600, height = 440) {
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#EAF1FB'; ctx.fillRect(0, 0, width, height);

  const pts = geoPoints();
  if (!pts.length) {
    ctx.fillStyle = '#1A73E8'; ctx.font = '16px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('No GPS coordinates captured yet', width / 2, height / 2);
    return canvas;
  }

  const originLat = pts.reduce((s, p) => s + p.lat, 0) / pts.length;
  const originLng = pts.reduce((s, p) => s + p.lng, 0) / pts.length;
  const xy = pts.map(p => Object.assign({}, p, toLocalXY(p.lat, p.lng, originLat, originLng)));

  const pad = 50;
  const xs = xy.map(p => p.x), ys = xy.map(p => p.y);
  let minX = Math.min(...xs, -5), maxX = Math.max(...xs, 5);
  let minY = Math.min(...ys, -5), maxY = Math.max(...ys, 5);
  const span = Math.max(maxX - minX, maxY - minY, 10);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  minX = cx - span / 2; maxX = cx + span / 2; minY = cy - span / 2; maxY = cy + span / 2;

  function project(x, y) {
    return [
      pad + (x - minX) / (maxX - minX) * (width - 2 * pad),
      height - pad - (y - minY) / (maxY - minY) * (height - 2 * pad)
    ];
  }

  ctx.strokeStyle = '#AECBFA'; ctx.lineWidth = 1;
  ctx.strokeRect(pad, pad, width - 2 * pad, height - 2 * pad);

  const scaleMeters = niceRoundScale(span / 4);
  const scalePx = scaleMeters / (maxX - minX) * (width - 2 * pad);
  ctx.strokeStyle = '#1A73E8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, height - 20); ctx.lineTo(pad + scalePx, height - 20); ctx.stroke();
  ctx.fillStyle = '#1A73E8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(`${scaleMeters} m`, pad, height - 26);

  ctx.save();
  ctx.translate(width - 30, 36);
  ctx.strokeStyle = '#1A73E8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, -14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-5, -5); ctx.lineTo(5, -5); ctx.closePath();
  ctx.fillStyle = '#1A73E8'; ctx.fill();
  ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('N', 0, -18);
  ctx.restore();

  xy.forEach(p => {
    const [px, py] = project(p.x, p.y);
    ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#1A73E8'; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(p.i + 1), px, py + 1);
    ctx.fillStyle = '#0B1220'; ctx.font = '10px sans-serif'; ctx.textBaseline = 'alphabetic';
    ctx.fillText((p.t.species || 'Tree ' + (p.i + 1)).slice(0, 18), px, py + 22);
  });
  return canvas;
}

function taskSummaryLine(t) {
  return t.tasks.map(x => {
    const tt = taskTotals(x);
    const label = x.type === 'Other' ? (x.customType || 'Other') : x.type;
    return `${label} [${tt.hrs}h / $${money(tt.price)}]${x.isSplit ? ' (SPLIT)' : ''}`;
  }).join('; ');
}

function buildGeoJSON() {
  return {
    type: 'FeatureCollection',
    features: state.trees.map((t, i) => {
      const lat = parseFloat(t.gps.lat), lng = parseFloat(t.gps.lng);
      const totals = treeTotals(t);
      return {
        type: 'Feature',
        geometry: (isFinite(lat) && isFinite(lng)) ? { type: 'Point', coordinates: [lng, lat] } : null,
        properties: {
          treeNumber: i + 1,
          species: t.species || '',
          dbh: t.dbh || '',
          location: t.location || '',
          treePrice: t.price || '',
          gpsAccuracyMeters: t.gps.accuracy || null,
          tasks: taskSummaryLine(t),
          estimatedHours: totals.hrs,
          estimatedPrice: totals.price,
          hasMainPhoto: !!t.mainPhoto
        }
      };
    })
  };
}

function csvEscape(v) {
  v = String(v == null ? '' : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function buildCsv() {
  const headers = ['Tree#', 'Species', 'DBH', 'Location', 'TreePrice', 'Latitude', 'Longitude', 'GPSAccuracy_m', 'Tasks', 'EstHours', 'EstPrice'];
  const rows = state.trees.map((t, i) => {
    const totals = treeTotals(t);
    return [
      i + 1, t.species, t.dbh, t.location, t.price,
      t.gps.lat || '', t.gps.lng || '', t.gps.accuracy ? Math.round(t.gps.accuracy) : '',
      taskSummaryLine(t), totals.hrs.toFixed(2), totals.price.toFixed(2)
    ];
  });
  return [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
}

/* =========================== PDF generation =========================== */
function fitBox(w, h, maxW, maxH) {
  const ratio = Math.min(maxW / w, maxH / h);
  return { w: w * ratio, h: h * ratio };
}

async function buildPdf() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const PAGE_W = 612, PAGE_H = 792, MARGIN = 42, CONTENT_W = PAGE_W - MARGIN * 2;
  let y = MARGIN;

  function footerStamp() { return new Date().toLocaleString(); }

  function newPage() {
    doc.addPage();
    y = MARGIN;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(`${state.client.clientName || ''} — Tree Inspection Report`, MARGIN, 24);
    doc.setDrawColor(200); doc.line(MARGIN, 30, PAGE_W - MARGIN, 30);
    y = 46;
  }
  function ensure(h) { if (y + h > PAGE_H - MARGIN - 16) newPage(); }

  function heading(text, size = 13) {
    ensure(28);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(size); doc.setTextColor(21, 41, 74);
    doc.text(text, MARGIN, y); y += 8;
    doc.setDrawColor(26, 115, 232); doc.setLineWidth(1.2);
    doc.line(MARGIN, y, PAGE_W - MARGIN, y); y += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(20, 20, 20);
  }

  function labelValue(label, value, labelW = 120) {
    const lines = doc.splitTextToSize(value || '—', CONTENT_W - labelW);
    ensure(lines.length * 12 + 4);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(60);
    doc.text(label.toUpperCase(), MARGIN, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(20);
    lines.forEach((ln, i) => doc.text(ln, MARGIN + labelW, y + i * 12));
    y += lines.length * 12 + 6;
  }

  function paragraphBox(title, text, accent) {
    if (!text) return;
    const lines = doc.splitTextToSize(text, CONTENT_W - 24);
    const boxH = lines.length * 12 + 34;
    ensure(boxH);
    doc.setFillColor(248, 250, 249);
    doc.roundedRect(MARGIN, y, CONTENT_W, boxH, 6, 6, 'F');
    doc.setDrawColor(accent[0], accent[1], accent[2]);
    doc.setLineWidth(3);
    doc.line(MARGIN + 2, y + 4, MARGIN + 2, y + boxH - 4);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(accent[0], accent[1], accent[2]);
    doc.text(title, MARGIN + 14, y + 16);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(30);
    lines.forEach((ln, i) => doc.text(ln, MARGIN + 14, y + 30 + i * 12));
    y += boxH + 14;
  }

  function taskTable(tasks, treeIdx) {
    const colTask = 150, colHours = 55, colPrice = 65, colDetails = CONTENT_W - colTask - colHours - colPrice;
    ensure(20);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(255);
    doc.setFillColor(21, 41, 74);
    doc.rect(MARGIN, y, CONTENT_W, 18, 'F');
    doc.text('TASK', MARGIN + 6, y + 12);
    doc.text('DETAILS', MARGIN + colTask + 6, y + 12);
    doc.text('HRS', MARGIN + colTask + colDetails + 6, y + 12);
    doc.text('PRICE', MARGIN + colTask + colDetails + colHours + 6, y + 12);
    y += 18;
    let subtotalHrs = 0, subtotalPrice = 0;
    tasks.forEach((task, i) => {
      const typeLabel = `${photoLabel(treeIdx, i)}. ${task.type === 'Other' ? (task.customType || 'Other') : task.type}`;
      const typeLines = doc.splitTextToSize(typeLabel, colTask - 10);
      const detailLines = doc.splitTextToSize(task.details || '—', colDetails - 10);
      const tt = taskTotals(task);
      const extraLines = task.isSplit ? [`⚡ SPLIT — Job A: ${(parseFloat(task.hours) || 0).toFixed(2)}h/$${money(task.price)} · Job B: ${(parseFloat(task.splitHours) || 0).toFixed(2)}h/$${money(task.splitPrice)}`] : [];
      const bodyLineCount = Math.max(typeLines.length, detailLines.length, 1);
      const rowH = (bodyLineCount + extraLines.length) * 12 + 8;
      ensure(rowH);
      if (i % 2 === 0) { doc.setFillColor(232, 240, 254); doc.rect(MARGIN, y, CONTENT_W, rowH, 'F'); }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(20);
      typeLines.forEach((ln, j) => doc.text(ln, MARGIN + 6, y + 12 + j * 12));
      doc.setFont('helvetica', 'normal');
      detailLines.forEach((ln, j) => doc.text(ln, MARGIN + colTask + 6, y + 12 + j * 12));
      doc.text(tt.hrs ? tt.hrs.toFixed(2) : '—', MARGIN + colTask + colDetails + 6, y + 12);
      doc.text(tt.price ? '$' + money(tt.price) : '—', MARGIN + colTask + colDetails + colHours + 6, y + 12);
      if (extraLines.length) {
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(180, 83, 9);
        doc.text(extraLines[0], MARGIN + 6, y + 12 + bodyLineCount * 12);
      }
      subtotalHrs += tt.hrs; subtotalPrice += tt.price;
      y += rowH;
    });
    y += 4;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(21, 41, 74);
    doc.text(`Task Subtotal: ${subtotalHrs.toFixed(2)} hrs · $${money(subtotalPrice)}`, PAGE_W - MARGIN, y, { align: 'right' });
    y += 16;
    return { hrs: subtotalHrs, price: subtotalPrice };
  }

  function photosGrid(photoLabelPairs) {
    const items = photoLabelPairs.filter(pair => pair.photo);
    if (!items.length) return;
    const gap = 14, boxW = (CONTENT_W - gap) / 2, boxH = 190;
    for (let i = 0; i < items.length; i += 2) {
      ensure(boxH + 10);
      const row = [items[i], items[i + 1]].filter(Boolean);
      row.forEach((item, col) => {
        const p = item.photo;
        const x = MARGIN + col * (boxW + gap);
        const fit = fitBox(p.width, p.height, boxW, boxH - 16);
        const ix = x + (boxW - fit.w) / 2;
        const src = p.hasMarkup ? p.markupDataUrl : p.originalDataUrl;
        try { doc.addImage(src, 'JPEG', ix, y, fit.w, fit.h); } catch (e) {}
        doc.setFontSize(8); doc.setTextColor(100); doc.setFont('helvetica', 'normal');
        doc.text(`Photo ${item.label}${p.hasMarkup ? ' (markup)' : ''}`, x + boxW / 2, y + boxH - 4, { align: 'center' });
      });
      y += boxH + 10;
    }
  }

  // Cover / header
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(21, 41, 74);
  doc.text('RTEC GTW Job Builder — Tree & Landscape Inspection Report', MARGIN, y); y += 22;
  doc.setDrawColor(26, 115, 232); doc.setLineWidth(1.5); doc.line(MARGIN, y, PAGE_W - MARGIN, y); y += 16;

  labelValue('SingleOps Lead #', state.client.singleOpsLead);
  labelValue('Client', state.client.clientName);
  labelValue('Job Site Address', state.client.propertyAddress);
  labelValue('Contact', [state.client.contactName, state.client.contactPhone, state.client.contactEmail].filter(Boolean).join(' · '));
  labelValue('Inspection Date', state.client.inspectionDate);
  labelValue('Arborist', state.client.arboristName);
  y += 6;

  heading('Tree & Landscape Inventory');
  let runningHrs = 0, runningPrice = 0;
  state.trees.forEach((t, i) => {
    ensure(24);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(26, 115, 232);
    doc.text(`Tree ${i + 1}: ${t.species || 'Unspecified Species'}`, MARGIN, y); y += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(20);

    photosGrid([{ label: photoLabel(i, null), photo: t.mainPhoto }]);

    labelValue('Location', t.location, 100);
    labelValue('DBH', t.dbh, 100);
    if (t.gps.lat && t.gps.lng) labelValue('GPS', `${t.gps.lat}, ${t.gps.lng}${t.gps.accuracy ? ` (±${Math.round(t.gps.accuracy)}m)` : ''}`, 100);
    if (t.price) labelValue('Tree Price', '$' + money(t.price), 100);

    const taskSub = t.tasks.length ? taskTable(t.tasks, i) : { hrs: 0, price: 0 };
    photosGrid(t.tasks.map((task, ti) => ({ label: photoLabel(i, ti), photo: task.photo })));

    const treeHrs = taskSub.hrs, treePrice = taskSub.price + (parseFloat(t.price) || 0);
    runningHrs += treeHrs; runningPrice += treePrice;
    ensure(14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(120);
    doc.text(`Running Total Through Tree ${i + 1}: ${runningHrs.toFixed(2)} hrs · $${money(runningPrice)}`, PAGE_W - MARGIN, y, { align: 'right' });
    y += 18;
  });
  if (!state.trees.length) {
    doc.setFontSize(10); doc.setTextColor(100);
    doc.text('No trees were recorded for this inspection.', MARGIN, y); y += 16;
  }

  ensure(30);
  doc.setFillColor(232, 240, 254);
  doc.roundedRect(MARGIN, y, CONTENT_W, 26, 6, 6, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(21, 41, 74);
  doc.text(`GRAND TOTAL: ${runningHrs.toFixed(2)} hrs · $${money(runningPrice)}`, MARGIN + 12, y + 18);
  y += 38;

  heading('Site Map & GPS Reference');
  const gc1 = 32, gc2 = 160, gc3 = (CONTENT_W - gc1 - gc2) / 2;
  ensure(18);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(255);
  doc.setFillColor(21, 41, 74); doc.rect(MARGIN, y, CONTENT_W, 18, 'F');
  doc.text('#', MARGIN + 6, y + 12);
  doc.text('SPECIES', MARGIN + gc1 + 6, y + 12);
  doc.text('LATITUDE', MARGIN + gc1 + gc2 + 6, y + 12);
  doc.text('LONGITUDE', MARGIN + gc1 + gc2 + gc3 + 6, y + 12);
  y += 18;
  state.trees.forEach((t, i) => {
    const rowH = 16;
    ensure(rowH);
    if (i % 2 === 0) { doc.setFillColor(232, 240, 254); doc.rect(MARGIN, y, CONTENT_W, rowH, 'F'); }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(20);
    doc.text(String(i + 1), MARGIN + 6, y + 11);
    doc.text((t.species || 'Unspecified').slice(0, 26), MARGIN + gc1 + 6, y + 11);
    doc.text(t.gps.lat ? String(t.gps.lat) : '—', MARGIN + gc1 + gc2 + 6, y + 11);
    doc.text(t.gps.lng ? String(t.gps.lng) + (t.gps.accuracy ? `  (±${Math.round(t.gps.accuracy)}m)` : '') : '—', MARGIN + gc1 + gc2 + gc3 + 6, y + 11);
    y += rowH;
  });
  if (!state.trees.length) { doc.setFontSize(10); doc.setTextColor(100); doc.text('No trees recorded.', MARGIN, y + 10); y += 16; }
  y += 10;

  const mapCanvas = renderSiteMapCanvas(900, 660);
  const mapFit = fitBox(mapCanvas.width, mapCanvas.height, CONTENT_W, 320);
  ensure(mapFit.h + 20);
  doc.setDrawColor(207, 224, 251); doc.setLineWidth(1);
  doc.rect(MARGIN, y, mapFit.w, mapFit.h);
  try { doc.addImage(mapCanvas.toDataURL('image/png'), 'PNG', MARGIN, y, mapFit.w, mapFit.h); } catch (e) {}
  y += mapFit.h + 10;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(110);
  doc.text('Positions are relative to one another (derived from captured GPS), not an absolute surveyed map.', MARGIN, y);
  y += 18;

  const wp = state.workPlan;
  heading('Work Plan & Logistics Summary');
  labelValue('Crew Size', wp.crewSize);
  const equipLines = EQUIPMENT_FIELDS
    .filter(f => wp.equipment[f.key] !== 'Not Needed')
    .map(f => `${f.label}: ${wp.equipment[f.key]}${f.priceKey && wp.equipment[f.priceKey] ? ' ($' + money(wp.equipment[f.priceKey]) + ')' : ''}`)
    .concat(wp.equipment.equipmentOther ? [wp.equipment.equipmentOther] : []);
  labelValue('Equipment Needed', equipLines.join('; '));
  labelValue('Traffic Control', wp.trafficControl);
  labelValue('Access / Permits', [...wp.permitsChecklist, wp.permitsCustom].filter(Boolean).join(', '));
  labelValue('Safety Concerns', wp.safetyConcerns);
  labelValue('Scheduling Concerns', wp.schedulingConcerns);
  y += 8;

  paragraphBox('CREW WORK ORDER — INTERNAL USE', wp.crewNotes, [155, 28, 28]);
  paragraphBox('CLIENT-FACING PROPOSAL NOTES', wp.clientNotes, [26, 115, 232]);
  paragraphBox('INTERNAL NOTES — OFFICE / BILLING', wp.internalNotes, [21, 41, 74]);

  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(`Page ${i} of ${totalPages}`, PAGE_W / 2, PAGE_H - 20, { align: 'center' });
    doc.text(footerStamp(), PAGE_W - MARGIN, PAGE_H - 20, { align: 'right' });
  }

  return doc;
}

function dataURLtoBlob(dataUrl) {
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/data:(.*);base64/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  return url;
}

function reportFilename(ext) {
  const slug = slugify(state.client.clientName || 'Client');
  const date = state.client.inspectionDate || todayISO();
  return `Inspection_Report_${slug}_${date}.${ext}`;
}

async function exportPdf() {
  flashToast('Building PDF…');
  const doc = await buildPdf();
  const blob = doc.output('blob');
  const name = reportFilename('pdf');
  const url = downloadBlob(blob, name);
  addExportLink(name, url);
  flashToast('PDF ready ✓');
}

async function exportZip() {
  flashToast('Building package…');
  const doc = await buildPdf();
  const pdfBlob = doc.output('blob');
  const zip = new JSZip();
  const clientSlug = slugify(state.client.clientName || 'Client');
  const date = state.client.inspectionDate || todayISO();
  zip.file(reportFilename('pdf'), pdfBlob);
  zip.file(`Trees_${clientSlug}_${date}.geojson`, JSON.stringify(buildGeoJSON(), null, 2));
  zip.file(`Trees_${clientSlug}_${date}.csv`, buildCsv());
  const photosFolder = zip.folder('Photos');
  state.trees.forEach((t, idx) => {
    const speciesSlug = slugify(t.species || 'Tree');
    function addPhotoFile(photo, label) {
      if (!photo) return;
      photosFolder.file(`Tree_${speciesSlug}_${label}.jpg`, dataURLtoBlob(photo.originalDataUrl));
      if (photo.hasMarkup) photosFolder.file(`Tree_${speciesSlug}_${label}_markup.jpg`, dataURLtoBlob(photo.markupDataUrl));
    }
    addPhotoFile(t.mainPhoto, photoLabel(idx, null));
    t.tasks.forEach((task, ti) => addPhotoFile(task.photo, photoLabel(idx, ti)));
  });
  const blob = await zip.generateAsync({ type: 'blob' });
  const name = `SingleOps_Package_${clientSlug}_${date}.zip`;
  const url = downloadBlob(blob, name);
  addExportLink(name, url);
  flashToast('Package ready ✓');
}

function addExportLink(name, url) {
  const box = document.getElementById('exportLinks');
  if (!box) return;
  const row = document.createElement('div');
  row.innerHTML = `✓ <a href="${url}" target="_blank" rel="noopener" class="underline font-semibold">${esc(name)}</a> — tap to open/save if the download didn't prompt automatically.`;
  box.appendChild(row);
}

/* =========================== Event wiring (delegation) =========================== */
function handleBindEvent(e) {
  const el = e.target.closest('[data-bind]');
  if (!el) return;
  setByPath(state, el.dataset.bind, el.value);
  schedulePersist();
  if (el.dataset.recalc) updateTotals();
  if (el.tagName === 'SELECT') renderAll();
}
document.addEventListener('input', handleBindEvent);
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') handleBindEvent(e); });

document.addEventListener('click', async e => {
  const el = e.target;

  const gotoStep = el.closest('[data-goto-step]');
  if (gotoStep) { goToStep(Number(gotoStep.dataset.gotoStep)); return; }

  const gotoConfirm = el.closest('[data-goto-step-confirm]');
  if (gotoConfirm) {
    if (!state.trees.length) {
      const ok = await confirmDialog('No trees added', 'Continue to the Work Plan without any trees in the inventory?');
      if (!ok) return;
    }
    goToStep(Number(gotoConfirm.dataset.gotoStepConfirm));
    return;
  }

  if (el.closest('[data-next-from-1]')) {
    if (!state.client.clientName || !state.client.propertyAddress) {
      flashToast('Enter client name and job site address to continue');
      return;
    }
    goToStep(2); return;
  }

  if (el.closest('[data-add-tree]')) { addTree(); return; }

  const toggle = el.closest('[data-toggle-tree]');
  if (toggle) { toggleTree(toggle.dataset.toggleTree); return; }

  const delTree = el.closest('[data-remove-tree]');
  if (delTree) { removeTree(delTree.dataset.removeTree); return; }

  const addT = el.closest('[data-add-task]');
  if (addT) { addTask(addT.dataset.addTask); return; }

  const remT = el.closest('[data-remove-task]');
  if (remT) { const [treeId, taskId] = remT.dataset.removeTask.split(':'); removeTask(treeId, taskId); return; }

  const splitT = el.closest('[data-toggle-split]');
  if (splitT) { const [treeId, taskId] = splitT.dataset.toggleSplit.split(':'); toggleSplit(treeId, taskId); return; }

  const remP = el.closest('[data-remove-photo]');
  if (remP) { removePhoto(remP.dataset.removePhoto); return; }

  const remarkP = el.closest('[data-remark-photo]');
  if (remarkP) { openMarkupModal(remarkP.dataset.remarkPhoto); return; }

  const takePhoto = el.closest('[data-take-photo]');
  if (takePhoto) { pendingPhotoTarget = takePhoto.dataset.takePhoto; document.getElementById('fileCamera').click(); return; }
  const choosePhoto = el.closest('[data-choose-photo]');
  if (choosePhoto) { pendingPhotoTarget = choosePhoto.dataset.choosePhoto; document.getElementById('fileLibrary').click(); return; }

  const capGps = el.closest('[data-capture-gps]');
  if (capGps) { captureGps(capGps.dataset.captureGps); return; }

  const togglePermit = el.closest('[data-toggle-permit]');
  if (togglePermit) {
    const val = togglePermit.dataset.togglePermit;
    const arr = state.workPlan.permitsChecklist;
    const i = arr.indexOf(val);
    if (i === -1) arr.push(val); else arr.splice(i, 1);
    schedulePersist(); renderAll();
    return;
  }

  const mTool = el.closest('[data-markup-tool]');
  if (mTool) { markup.tool = mTool.dataset.markupTool; renderMarkupToolbar(); return; }
  const mColor = el.closest('[data-markup-color]');
  if (mColor) { markup.color = mColor.dataset.markupColor; renderMarkupToolbar(); return; }

  if (el.id === 'markupResetZoom') { markup.zoom = { scale: 1, tx: 0, ty: 0 }; applyZoomTransform(); return; }
  if (el.id === 'markupUndo') { markup.strokes.pop(); redrawMarkup(); return; }
  if (el.id === 'markupClear') {
    const p = getPhotoSlot(parsePhotoTarget(markup.target)).get();
    markup.strokes = []; markup.current = null; markup.hadBaseMarkup = false;
    const img = new Image();
    img.onload = () => { markup.baseImage = img; redrawMarkup(); };
    img.src = p.originalDataUrl;
    return;
  }
  if (el.id === 'markupClose' || el.id === 'markupCancel') { document.getElementById('markupModal').classList.add('hidden'); return; }
  if (el.id === 'markupSave') {
    const canvas = document.getElementById('markupCanvas');
    const slot = getPhotoSlot(parsePhotoTarget(markup.target));
    const p = slot.get();
    p.hasMarkup = markup.hadBaseMarkup || markup.strokes.length > 0;
    p.markupDataUrl = p.hasMarkup ? canvas.toDataURL('image/jpeg', 0.88) : null;
    document.getElementById('markupModal').classList.add('hidden');
    schedulePersist(); renderAll();
    return;
  }

  if (el.id === 'btnPdf') { el.disabled = true; try { await exportPdf(); } finally { el.disabled = false; } return; }
  if (el.id === 'btnZip') { el.disabled = true; try { await exportZip(); } finally { el.disabled = false; } return; }

  if (el.id === 'btnNewInspection') {
    const ok = await confirmDialog('Start a new inspection?', 'This clears all client, tree, and work-plan data on this device. Make sure you already saved your PDF/ZIP export.');
    if (!ok) return;
    state = defaultState();
    await dbDelete('current').catch(() => {});
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    goToStep(1);
    return;
  }
});

document.getElementById('markupWidth').addEventListener('input', e => { markup.width = Number(e.target.value); });

document.addEventListener('change', e => {
  if (e.target.id === 'fileCamera' || e.target.id === 'fileLibrary') {
    const file = e.target.files[0];
    const target = pendingPhotoTarget;
    e.target.value = '';
    if (file && target) handlePhotoFile(target, file);
  }
});

document.getElementById('themeToggle').addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('arborist_theme', isDark ? 'dark' : 'light'); } catch (e) {}
});

/* =========================== Init / migration =========================== */
function applySpeciesList() {
  document.getElementById('speciesList').innerHTML = SPECIES_OPTIONS.map(s => `<option value="${esc(s)}">`).join('');
}

function migrateState() {
  const c = state.client;
  if (c.singleOpsLead === undefined) c.singleOpsLead = '';
  delete c.companyName; delete c.credentials; delete c.certNumber;

  if (!state.workPlan.equipment || Array.isArray(state.workPlan.equipment)) {
    state.workPlan.equipment = defaultEquipment();
  }
  EQUIPMENT_FIELDS.forEach(f => {
    if (state.workPlan.equipment[f.key] === undefined) state.workPlan.equipment[f.key] = 'Not Needed';
    if (f.priceKey && state.workPlan.equipment[f.priceKey] === undefined) state.workPlan.equipment[f.priceKey] = '';
  });
  if (state.workPlan.permitsChecklist === undefined) state.workPlan.permitsChecklist = [];
  if (state.workPlan.permitsCustom === undefined) state.workPlan.permitsCustom = state.workPlan.permits || '';
  if (state.workPlan.internalNotes === undefined) state.workPlan.internalNotes = state.workPlan.adminNotes || '';
  if (state.workPlan.schedulingConcerns === undefined) state.workPlan.schedulingConcerns = state.workPlan.schedulingPrefs || '';
  delete state.workPlan.permits; delete state.workPlan.adminNotes; delete state.workPlan.schedulingPrefs;
  delete state.workPlan.neighborPermission; delete state.workPlan.neighborNotes;

  state.trees.forEach(t => {
    if (!t.gps) t.gps = defaultGps();
    if (t.price === undefined) t.price = '';
    if (t.mainPhoto === undefined) t.mainPhoto = (t.photos && t.photos[0]) || null;
    delete t.height; delete t.photos;
    (t.tasks || []).forEach(task => {
      if (task.price === undefined) task.price = '';
      if (task.isSplit === undefined) task.isSplit = false;
      if (task.splitHours === undefined) task.splitHours = '';
      if (task.splitPrice === undefined) task.splitPrice = '';
      if (task.photo === undefined) task.photo = null;
    });
  });
}

async function init() {
  applySpeciesList();

  const savedTheme = (() => { try { return localStorage.getItem('arborist_theme'); } catch (e) { return null; } })();
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (savedTheme === 'dark' || (!savedTheme && prefersDark)) document.documentElement.classList.add('dark');

  try {
    const rec = await dbGet('current');
    if (rec && rec.state) state = Object.assign(defaultState(), rec.state);
  } catch (e) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = Object.assign(defaultState(), JSON.parse(raw));
    } catch (e2) {}
  }
  migrateState();

  wireMarkupCanvas();
  renderAll();

  const statusEl = document.getElementById('statusLine');
  statusEl.textContent = navigator.onLine ? 'Online — caching for offline use…' : 'Offline';
  window.addEventListener('online', () => statusEl.textContent = 'Online');
  window.addEventListener('offline', () => statusEl.textContent = 'Offline — still fully usable');

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;
      statusEl.textContent = '🟢 Offline Ready';
    } catch (e) {
      statusEl.textContent = 'Running (offline caching unavailable)';
    }
  } else {
    statusEl.textContent = 'Running (open via a server for offline caching)';
  }
}

init();
</script>
